#version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: french-db
    restart: always
    logging: &logs-limites
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Serveur de 1 Go de RAM : on limite la mémoire de MySQL pour éviter le swap
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --max-connections=40
      - --table-open-cache=400
      - --table-definition-cache=400
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - french-network

  app:
    image: rolandmerhej1/french-app:v1.12.1
    container_name: french-app
    restart: always
    # Journaux limités à 3 fichiers de 10 Mo (sans cela, ils grossissent sans fin)
    logging: *logs-limites
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Spring Boot Profile
      SPRING_PROFILES_ACTIVE: prod
      # Limite la mémoire de la JVM (sinon elle peut viser 75 % des 818 Mo de la machine)
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx320m"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_ERROR_INCLUDE_MESSAGE: never
      SERVER_ERROR_INCLUDE_BINDING_ERRORS: never
      SPRING_THYMELEAF_CACHE: "true"

      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      # Admin User (pour DataInitializer)
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Clé des cookies remember-me
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY}

      # Optional: JPA settings
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - french-network

networks:
  french-network:
    driver: bridge

volumes:
  mysql-data: