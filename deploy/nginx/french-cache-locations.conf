# À copier dans /etc/nginx/snippets/ puis à inclure dans le bloc « server » HTTPS (port 443),
# juste AVANT « location / { » (voir deploy/nginx/README.md).

# --- Compression des pages et des fichiers texte (réduit fortement les données envoyées) ---
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_types text/css text/plain application/javascript application/json application/manifest+json application/xml image/svg+xml;

# --- Scripts et styles : cache court (10 minutes), pour qu'un déploiement soit vite visible ---
location ~ ^/(css|js)/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache french_static;
    proxy_cache_valid 200 10m;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    # Si l'application redémarre (déploiement), on continue de servir la copie en cache
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    # L'application demande « no-cache » au navigateur ; Nginx garde quand même sa copie 10 minutes
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always;
}

# --- Images, audio, fichiers téléversés : cache d'un jour ---
location ~ ^/(uploads|images|audio|webjars)/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache french_static;
    proxy_cache_valid 200 1d;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always;
}

# Les pages (HTML) ne sont volontairement PAS mises en cache : elles contiennent le jeton de sécurité
# des formulaires et le nom de la personne connectée.
