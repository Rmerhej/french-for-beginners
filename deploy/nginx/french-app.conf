# Copie de /etc/nginx/conf.d/french-app.conf (serveur de production).
# Les lignes « managed by Certbot » sont gérées par Certbot : ne pas les modifier à la main.
# Le certificat et les clés restent dans /etc/letsencrypt (jamais dans le dépôt).
server {
    server_name frenchforbeginners.duckdns.org;
    include /etc/nginx/snippets/french-cache-locations.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/frenchforbeginners.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/frenchforbeginners.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = frenchforbeginners.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name frenchforbeginners.duckdns.org;
    return 404; # managed by Certbot


}
