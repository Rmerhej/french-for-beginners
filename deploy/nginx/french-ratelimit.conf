# Limitation du débit par adresse IP (à placer dans /etc/nginx/conf.d/).
# Valeurs larges : une classe entière qui se connecte au même Wi-Fi (même adresse IP) ne doit pas être bloquée.
limit_req_zone $binary_remote_addr zone=french_all:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=french_login:10m rate=1r/s;
limit_req_status 429;
