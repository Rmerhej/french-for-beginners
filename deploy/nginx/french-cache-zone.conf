# Zone de cache Nginx pour les fichiers statiques de French For Beginners.
# À copier dans /etc/nginx/conf.d/ (voir deploy/nginx/README.md).
# 10 Mo de clés (environ 80 000 fichiers), 300 Mo maximum sur le disque, fichier oublié après 7 jours sans visite.
proxy_cache_path /var/cache/nginx/french levels=1:2 keys_zone=french_static:10m max_size=300m inactive=7d use_temp_path=off;
