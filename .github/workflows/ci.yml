name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # appelé aussi par cd.yml avant toute mise en production
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test