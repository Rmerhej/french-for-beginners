name: Contrôle du certificat HTTPS

# Vérifie chaque jour, depuis l'extérieur, que le certificat du site n'est pas près d'expirer.
# Si ce n'est pas le cas, le travail échoue et GitHub envoie un e-mail (notifications « Actions »).
# Let's Encrypt renouvelle le certificat quand il lui reste 30 jours : si, malgré cela, il en reste
# moins de 14, le renouvellement automatique est en panne (voir OPERATIONS.md, section « HTTPS / Certificat »).
on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours à 05h17 UTC
  workflow_dispatch:        # lancement manuel possible depuis l'onglet « Actions »

jobs:
  certificat:
    runs-on: ubuntu-latest
    timeout-minutes: 3          # jamais d'exécution sans fin : au bout de 3 minutes, GitHub l'arrête
    env:
      HOST: frenchforbeginners.duckdns.org
      DAYS: "14"
    steps:
      - name: Vérifier la date d'expiration du certificat
        run: |
          set +e
          log=$(mktemp)
          cert=$(mktemp)
          # openssl peut rester à attendre la fermeture de la connexion : on l'arrête au bout de 20 secondes.
          # Le certificat est déjà affiché à ce moment-là, on le lit dans le résultat.
          timeout "${TLS_TIMEOUT:-20}" openssl s_client -connect "$HOST:${PORT:-443}" -servername "$HOST" < /dev/null > "$log" 2>&1
          openssl x509 -in "$log" -outform PEM > "$cert" 2>/dev/null
          if [ ! -s "$cert" ]; then
            echo "::error::Impossible de lire le certificat de $HOST (site arrêté ou injoignable ?)"
            echo "--- Réponse de openssl ---"
            cat "$log"
            exit 1
          fi
          echo "Le certificat de $HOST expire le : $(openssl x509 -in "$cert" -noout -enddate | cut -d= -f2)"
          if ! openssl x509 -in "$cert" -noout -checkend $((DAYS * 86400)) > /dev/null; then
            echo "::error::Le certificat de $HOST expire dans moins de $DAYS jours : le renouvellement automatique ne fonctionne pas."
            exit 1
          fi
          echo "OK : plus de $DAYS jours restants."
