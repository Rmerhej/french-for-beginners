name: CD

# Déploiement automatique : quand vous poussez une étiquette de version (ex. v1.15.5),
#   1) les tests passent,
#   2) l'image Docker est construite pour PC/serveurs classiques (amd64) ET serveurs ARM (Oracle A1),
#      puis envoyée sur Docker Hub,
#   3) le serveur est mis à jour par SSH (sauvegarde, nouvelle version, contrôle, retour arrière si échec).
# Lancement manuel possible (onglet « Actions ») pour remettre une ancienne version : voir CD.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version déjà publiée sur Docker Hub à (re)mettre en production, ex. v1.15.4"
        required: true

permissions:
  contents: read

# Un seul déploiement à la fois, jamais interrompu en route
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE: rolandmerhej1/french-app

jobs:
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Se lance si l'image est prête, ou si c'est un lancement manuel (l'image est alors sautée) ; jamais si un test a échoué.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'French-for-beginners' }}
    steps:
      - name: Contrôler le nom de la version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide : « $TAG » (attendu : v1.2.3)"
            exit 1
          fi

      - name: Mettre le serveur à jour
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              "$SSH_USER@$SSH_HOST" \
              "cd \"\$HOME/$DEPLOY_DIR\" && bash scripts/deploy.sh '$TAG'"
