spring:
  application:
    name: french-for-beginners

  # ==================== DATABASE ====================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/frenchdb?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true


  # ==================== FLYWAY ====================
 # flyway:
  #  enabled: true
  #  locations: classpath:db/migration
  #  baseline-on-migrate: true
  #  repair-on-migrate: true
  #  baseline-version: 0
  #  schemas: frenchdb
  #  encoding: UTF-8




  # ==================== FILE UPLOAD ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

  # ==================== THYMELEAF ====================
  thymeleaf:
    cache: false
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

  cache:
    type: simple

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 30d

# ==================== SERVER ====================
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

  error:
    include-message: always          # en développement
    include-binding-errors: always
    include-stacktrace: never        # très important en production
    path: /error

# ==================== LOGGING ====================
logging:
  level:
    com.apprendrefr: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# ==================== ADMIN ====================
admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}


# ==================== DEFAULT PROPERTIES ====================
app:
  security:
    remember-me-key: ${REMEMBER_ME_KEY:}
  upload:
    dir: uploads/

# ==================== PROD PROFILE ====================
---
spring:
  config:
    activate:
      on-profile: prod

  # La connexion à la base vient des variables SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (docker-compose.yml).

  mvc:
    throw-exception-if-no-handler-found: true
  thymeleaf:
    cache: true

server:
  # Nginx transmet le protocole d'origine (https) : les redirections et cookies en tiennent compte
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
  error:
    include-message: never
    include-binding-errors: never

   # flyway:
   #   enabled: true

app:
  upload:
    dir: /app/uploads/