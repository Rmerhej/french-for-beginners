spring:
  application:
    name: french-for-beginners

  # ==================== DATABASE ====================
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/frenchdb?useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true


  # ==================== FILE UPLOAD ====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

  # ==================== THYMELEAF ====================
  thymeleaf:
    cache: false
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

  cache:
    type: simple

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 30d

# ==================== SERVER ====================
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

# ==================== LOGGING ====================
logging:
  level:
    com.apprendrefr: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# ==================== ADMIN ====================
admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}


# ==================== DEFAULT PROPERTIES ====================
app:
  upload:
    dir: uploads/

# ==================== PROD PROFILE ====================
---
spring:
  config:
    activate:
      on-profile: dev

app:
  upload:
    dir: /app/uploads/