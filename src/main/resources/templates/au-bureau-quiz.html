<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Au Bureau Quizzes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .dropzone { display: inline-block; width: 160px; height: 50px; border: 2px dashed #6c757d; text-align: center; vertical-align: middle; background: #f8f9fa; border-radius: 8px; margin: 0 6px; font-size: 1.1em; }
        .dropzone.over { background: #d1e7dd; border-color: #198754; }
        .word { display: inline-block; padding: 12px 18px; margin: 6px; background: #0d6efd; color: white; border-radius: 8px; cursor: grab; font-weight: bold; }
        .word.dragging { opacity: 0.5; }
    </style>
</head>
<body class="container">
<div th:replace="~{fragments/navbar :: navbar}"></div><br>
<div>  <img src="uploads/images/UNITE-13-Au-bureau.jpg" height="400" width="800"></div>
<div class="container py-5">
    <button
            type="button"
            class="btn btn-outline-secondary float-end"
            onclick="history.back()">
        <i class="bi bi-arrow-left"></i> Retour
    </button>

    <div th:each="quiz, iter : ${quizzes}" class="quiz-wrapper mb-5 p-4 bg-white border rounded">
        <h1 th:text="${quiz.title}">Quiz Title</h1>


        <div class="card mb-4">
            <div class="card-header">Mots à placer (glisse-les)</div>
            <div class="card-body words-container" th:data-words="${quiz.words}"></div>
        </div>


        <div class="card mb-4">
            <div class="card-header">Complète la phrase :</div>
            <div class="card-body fs-4 lh-lg sentence-container"
                 th:id="'sentence-' + ${iter.index}"
                 th:data-answers="${quiz.correctAnswers}"
                 th:text="${quiz.sentence}" style="white-space: pre-line;"></div>
        </div>

        <button class="btn btn-success btn-lg me-3" th:onclick="'checkAnswers(' + ${iter.index} + ')'">Vérifier</button>
        <button class="btn btn-secondary btn-lg" th:onclick="'resetQuiz(' + ${iter.index} + ')'">Recommencer</button>
        <div th:id="'feedback-' + ${iter.index}" class="mt-4"></div>
    </div>

</div>

<script>
    // Initialize each quiz container
    document.querySelectorAll('.quiz-wrapper').forEach((wrapper, index) => {
        const sentenceDiv = wrapper.querySelector('.sentence-container');
        const wordsDiv = wrapper.querySelector('.words-container');

        // Prepare sentence: replace underscores
        sentenceDiv.innerHTML = sentenceDiv.innerHTML.replace(/____/g, '<span class="dropzone"></span>');

        // Add words
        const wordsList = wordsDiv.getAttribute('data-words').split(',');
        wordsList.forEach(w => {
            const el = document.createElement('div');
            el.className = 'word';
            el.draggable = true;
            el.textContent = w.trim();
            el.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.textContent);
                e.target.classList.add('dragging');
            });
            wordsDiv.appendChild(el);
        });
    });

    // Drag and Drop global listeners
    document.addEventListener('dragover', (e) => {
        if (e.target.classList.contains('dropzone')) {
            e.preventDefault();
            e.target.classList.add('over');
        }
    });
    document.addEventListener('dragleave', (e) => {
        if (e.target.classList.contains('dropzone')) e.target.classList.remove('over');
    });
    document.addEventListener('drop', (e) => {
        if (e.target.classList.contains('dropzone')) {
            e.preventDefault();
            e.target.textContent = e.dataTransfer.getData('text/plain');
            e.target.classList.remove('over');
        }
    });

    function checkAnswers(index) {
        const wrapper = document.querySelectorAll('.quiz-wrapper')[index];
        const zones = wrapper.querySelectorAll('.dropzone');
        const correctAnswers = wrapper.querySelector('.sentence-container').getAttribute('data-answers').split(',');

        let score = 0;
        zones.forEach((zone, i) => {
            if (zone.textContent.trim() === correctAnswers[i].trim()) {
                zone.style.backgroundColor = '#d1e7dd';
                score++;
            } else {
                zone.style.backgroundColor = '#f8d7da';
            }
        });
        document.getElementById('feedback-' + index).innerHTML =
            `<div class="alert alert-info">Ton score : ${score}/${zones.length}</div>`;
    }

    function resetQuiz(index) {
        const wrapper = document.querySelectorAll('.quiz-wrapper')[index];
        wrapper.querySelectorAll('.dropzone').forEach(z => z.textContent = '');
        document.getElementById('feedback-' + index).innerHTML = '';
    }
</script>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
