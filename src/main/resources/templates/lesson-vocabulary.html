<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lesson.title} + ' - Vocabulaire'"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${lesson.title}"></h2>
        <a th:href="@{/lesson/{id}(id=${lesson.id})}" class="btn btn-secondary">
            ← Retour à la leçon
        </a>
    </div>

    <div class="row">

        <div th:if="${vocabularies.isEmpty()}" class="col-12">
            <div class="alert alert-info text-center p-5">
                Aucun mot de vocabulaire pour cette leçon pour le moment.
            </div>
        </div>


        <div class="col-md-6 col-lg-4 mb-4" th:each="word : ${vocabularies}">
            <div class="card h-100 shadow-sm">

                <!-- Image -->
                <div class="text-center pt-3">
                    <img th:if="${word.imageUrl != null and word.imageUrl != ''}"
                         th:src="${word.imageUrl}"
                         class="img-fluid rounded"
                         style="max-height: 200px; object-fit: contain;"
                         th:alt="${word.frenchWord}">

                    <div th:if="${word.imageUrl == null or word.imageUrl == ''}"
                         class="bg-light d-flex align-items-center justify-content-center"
                         style="height: 200px; border: 2px dashed #ccc; border-radius: 8px;">
                        <span class="text-muted">Pas d'image disponible</span>
                    </div>
                </div>

                <div class="card-body text-center">

                    <h4 class="card-title fw-bold" th:text="${word.frenchWord}"></h4>


                    <p class="text-muted fs-5 mb-2" th:text="${word.englishTranslation}"></p>


                    <p th:if="${word.pronunciation != null and word.pronunciation != ''}"
                       class="text-secondary mb-3">
                        🔤 <strong th:text="${word.pronunciation}"></strong>
                    </p>


                    <div th:if="${word.exampleSentence != null and word.exampleSentence != ''}"
                         class="mt-3 p-3 bg-light border-start border-primary border-3 rounded text-start">
                        <small class="text-primary fw-bold">📝 Phrase utile :</small>
                        <p class="fst-italic mb-0" th:text="${word.exampleSentence}"></p>
                    </div>

                    <div th:if="${word.audioUrl != null and word.audioUrl != ''}" class="mt-3">
                        <button class="btn btn-play btn-primary d-flex align-items-center gap-2 mx-auto"
                                th:data-audio-url="${word.audioUrl}">
                            <i class="bi bi-play-fill"></i>
                            <span>Écouter la prononciation</span>
                        </button>

                        <!-- Audio caché -->
                        <audio class="d-none" th:attr="data-id=${word.id}"></audio>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/lesson-vocabulary.js}"></script>
</body>
</html>
