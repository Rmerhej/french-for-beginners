<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Roland MERHEJ">
    <title th:text="${#strings.contains(title, 'Débutants')} ? ${title} : ${title + ' | Français pour débutants'}"></title>
    <meta name="description" content="Apprenez le français : leçons, vocabulaire avec audio, exercices, quiz et conjugueur, du niveau A1 au B2.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="Français pour débutants">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" content="Leçons, vocabulaire avec audio, exercices, quiz et conjugueur, du niveau A1 au B2.">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/uploads/images/favicon-32x32.png}">
    <!-- Favicon classique pour les navigateurs qui demandent /favicon.ico -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" ...>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <script th:src="@{/js/visitor.js}"></script>
    <script th:src="@{/js/a11y.js}" defer></script>
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <meta name="theme-color" content="#1b2a6b">
    <link rel="apple-touch-icon" th:href="@{/pwa/icon-192.png}">
    <script th:src="@{/js/pwa-register.js}" defer></script>
</head>
