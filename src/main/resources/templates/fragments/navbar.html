<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark bg-dark shadow"
     xmlns:sec="http://www.w3.org/1999/xhtml"
     role="navigation" aria-label="navbar">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center fw-bold" th:href="@{/}"
           aria-label="Accueil - Apprendre le Français">

            <img th:src="@{/images/flag-fr.svg}" width="42" height="28"
                 alt="Drapeau Français"
                 style="height: 28px; width: auto; margin-right: 10px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;">
            <span>Apprendre le Français</span>
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false"
                aria-label="Ouvrir / fermer le menu de navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                    >Accueil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/lessons}"
                       sec:authorize="isAuthenticated()">
                        Leçons</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/conjugueur}">🔤 Conjugueur</a>
                </li>
            </ul>

            <div class="navbar-nav ms-auto">

                <div sec:authorize="isAuthenticated()" class="d-flex flex-wrap align-items-center gap-2 py-2">
                    <span class="navbar-text me-lg-2" aria-label="Utilisateur connecté">
                        👤 <strong sec:authentication="name"></strong>
                    </span>
                    <a th:href="@{/mes-resultats}"
                       class="btn btn-outline-light btn-sm rounded-pill px-3">📊 Mes résultats</a>
                    <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 d-inline-flex align-items-center" id="darkModeToggle" title="Changer de thème">
                        <span id="themeIcon" class="me-1">🌙</span>
                        <span id="themeText">Sombre</span>
                    </button>
                    <a th:href="@{/admin/dashboard}"
                       class="btn btn-outline-light"
                       sec:authorize="hasRole('ADMIN')"
                       aria-label="Accéder au panneau administrateur">
                        Admin
                    </a>

                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit"
                                class="btn btn-outline-danger"
                                aria-label="Se Déconnecter">
                            Déconnexion
                        </button>
                    </form>
                </div>


                <div sec:authorize="isAnonymous()" class="d-flex flex-wrap gap-2 py-2">
                    <a th:href="@{/login}"
                       class="btn btn-outline-light"
                       aria-label="Se Connecter à son compte">
                        Connexion</a>
                    <a th:href="@{/register}"
                       class="btn btn-primary"
                       aria-label="Créér un nouveau compte">S'inscrire</a>
                </div>
            </div>
        </div>
    </div>
</nav>
