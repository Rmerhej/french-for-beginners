<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Bibliothèques Bootstrap chargées depuis le CDN : UN SEUL endroit à modifier
  (version, hébergement local, intégrité SRI...) pour toutes les pages du site.
-->

<!-- Dans le <head> : Bootstrap + icônes Bootstrap -->
<th:block th:fragment="bootstrap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</th:block>

<!-- En fin de <body> : scripts Bootstrap (menus, modales, alertes...) -->
<th:block th:fragment="bootstrap-js">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
