<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Bibliothèques Bootstrap hébergées sur le site (static/vendor, aucun service externe) :
  UN SEUL endroit à modifier (version...) pour toutes les pages du site.
-->

<!-- Dans le <head> : Bootstrap + icônes Bootstrap -->
<th:block th:fragment="bootstrap">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-5.3.3/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons-1.11.3/bootstrap-icons.min.css}">
    <link rel="preload" th:href="@{/vendor/bootstrap-icons-1.11.3/fonts/bootstrap-icons.woff2}" as="font" type="font/woff2" crossorigin>
    <!-- Thème du site (police Plus Jakarta Sans hébergée ici, bleu, arrondis) : toujours APRÈS Bootstrap -->
    <link rel="preload" th:href="@{/fonts/PlusJakartaSans-wght.woff2}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</th:block>

<!-- En fin de <body> : scripts Bootstrap (menus, modales, alertes...) -->
<th:block th:fragment="bootstrap-js">
    <script th:src="@{/vendor/bootstrap-5.3.3/bootstrap.bundle.min.js}"></script>
</th:block>
</body>
</html>
