<div th:fragment="backToTop">
    <a href="#"
       id="btn-top"
       class="btn btn-primary position-fixed bottom-0 end-0 m-3 shadow d-flex align-items-center justify-content-center"
       aria-label="Retour en haut de page">
        ↑
    </a>

    <!-- Bouton « Retour » présent sur toutes les pages (sauf l'accueil) -->
    <button type="button"
            id="btn-back"
            class="btn btn-primary position-fixed bottom-0 start-0 m-3 shadow rounded-pill px-3 d-print-none"
            aria-label="Retour à la page précédente"
            hidden>
        ← Retour
    </button>

    <script>
        (function () {
            var btn = document.getElementById('btn-back');
            if (!btn) return;

            // Pas de bouton sur la page d'accueil
            var path = location.pathname.replace(/\/+$/, '') || '/';
            if (path === '/' || path === '/index') return;

            btn.hidden = false;

            btn.addEventListener('click', function () {
                // On revient en arrière seulement si la page précédente est sur ce site ;
                // sinon (lien externe, application installée, favori) on va à l'accueil.
                var sameSite = false;
                try {
                    sameSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
                } catch (e) { /* ignore */ }

                if (sameSite && history.length > 1) {
                    history.back();
                } else {
                    location.href = '/';
                }
            });
        })();
    </script>
</div>
