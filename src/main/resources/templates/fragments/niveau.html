<!-- Éléments communs aux pages de niveau (Débutant, Consolidation, Approfondissement) -->

<!-- En-tête : numéro de la page, titre, et niveaux CECR couverts (ex. « A1 → A2 ») -->
<div th:fragment="entete(numero, titre, niveaux, couleur)" class="d-flex align-items-center mb-4">
    <span th:class="|badge bg-${couleur} rounded-circle me-3 d-flex align-items-center justify-content-center fw-bold ${couleur == 'warning' ? 'text-dark' : 'text-white'}|"
          style="width: 42px; height: 42px; font-size: 1rem;"
          th:text="${numero}">1</span>
    <div>
        <h1 class="h2 mb-0 fw-bold" th:text="${titre}">Titre</h1>
        <span class="badge bg-light text-dark border mt-1" th:text="${niveaux}">A1 → A2</span>
    </div>
</div>

<!-- Carte « Grammaire & conjugaison » qui ouvre directement le bon niveau du parcours -->
<div th:fragment="supports(niveau, texte)" class="col-12 col-md-6">
    <div class="card h-100 border-0 shadow-sm rounded-4">
        <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4 p-lg-5">
            <div class="fs-1 mb-3" aria-hidden="true">📖</div>
            <h2 class="h5 card-title fw-bold">Grammaire &amp; conjugaison <span th:text="${niveau}">A1</span></h2>
            <p class="text-muted mb-4" th:text="${texte}">Un cours et un quiz pour chaque étape</p>
            <a th:href="@{/supports-de-cours}+'#niveau-'+${niveau}"
               class="btn btn-outline-success rounded-pill fw-bold w-100 mt-auto">
                Accéder aux cours <span th:text="${niveau}">A1</span>
            </a>
        </div>
    </div>
</div>
