<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lessonTitle}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .lesson-card { margin-bottom: 2rem; }
        table { width: 100%; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Français A1 - Grammaire</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/lessons/1}">Leçon 1</a>
            <!-- Add more nav links as needed -->
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-lg-12">
            <h1 class="mb-4" th:text="${lessonTitle}"></h1>

            <div class="lesson-content" th:utext="${lessonContent}"></div>

            <div class="mt-5">
                <a th:href="@{/lessons/{id}(id=${prevId})}" class="btn btn-secondary" th:if="${prevId != null}">← Leçon précédente</a>
                <a th:href="@{/lessons/{id}(id=${nextId})}" class="btn btn-primary float-end" th:if="${nextId != null}">Leçon suivante →</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
