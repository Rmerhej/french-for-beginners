<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="X-UA-Compatible"
          content="ie=edge">

    <title>Thème - Formulaire</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          rel="stylesheet">

    <link th:href="@{/css/style.css}"
          rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>


<!-- Titre -->
<div class="container py-5">
    <h1>Créer un nouveau thème (dialogue).</h1>
</div>


<main role="main" class="container">

    <form th:action="@{/admin/theme/new}"
          th:object="${theme}"
          method="post"
          enctype="multipart/form-data"
          class="mt-4">

        <!-- Nom du thème -->
        <div class="mb-3">

            <label for="nom"
                   class="form-label">
                Nom du thème
            </label>

            <input type="text"
                   id="nom"
                   class="form-control"
                   th:field="*{nom}"
                   placeholder="restaurant">

        </div>


        <!-- Titre -->
        <div class="mb-3">

            <label for="title"
                   class="form-label">
                Titre
            </label>

            <input type="text"
                   id="title"
                   class="form-control"
                   th:field="*{title}"
                   placeholder="Au restaurant">

        </div>


        <!-- Dialogue -->
        <div class="mb-3">

            <label for="dialogueContent"
                   class="form-label">
                Dialogue
            </label>

            <textarea id="dialogueContent"
                      class="form-control"
                      rows="20"
                      th:field="*{dialogueContent}"
                      placeholder="Écris le dialogue ici..."></textarea>

        </div>


        <!-- Audio -->
        <div class="mb-3">

            <label for="audioFile"
                   class="form-label">
                Audio
            </label>

            <input type="file"
                   id="audioFile"
                   class="form-control"
                   name="audioFile"
                   accept="audio/*">

        </div>


        <!-- Bouton -->
        <button type="submit"
                class="btn btn-primary">
            Enregistrer
        </button>

    </form>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<div th:replace="~{fragments/back-to-top :: backToTop}"></div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
