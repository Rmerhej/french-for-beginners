<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier le Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-5">
    <h2>Modifier le Quiz</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/quiz/edit/{id}(id=${quiz.id})}" method="post" th:object="${quiz}">

        <div class="mb-3">
            <label class="form-label">Titre du quiz</label>
            <input type="text" class="form-control" th:field="*{title}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phrase avec les trous (utilise ____ )</label>
            <textarea class="form-control" rows="3" th:field="*{sentence}" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Mots à placer (séparés par virgule)</label>
            <input type="text" class="form-control" th:field="*{words}"
                   placeholder="le,a,du" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Réponses correctes (dans l'ordre, séparées par virgule)</label>
            <input type="text" class="form-control" th:field="*{correctAnswers}"
                   placeholder="le,a" required>
        </div>

        <div class="mb-3">
            <label class="form-label">URL de l'image (optionnel)</label>
            <input type="text" class="form-control" th:field="*{imageUrl}"
                   placeholder="/images/infirmier.jpg">
        </div>

        <button type="submit" class="btn btn-primary btn-lg">Enregistrer les modifications</button>
        <a th:href="@{/quizzes}" class="btn btn-secondary btn-lg">Annuler</a>
    </form>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
