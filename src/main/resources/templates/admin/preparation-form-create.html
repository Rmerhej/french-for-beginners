<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Preparation-Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
<h2>Créer un nouveau Quiz</h2>

<form th:action="@{/admin/quiz/create}" method="post" th:object="${quiz}">
    <div class="mb-3">
        <label class="form-label">Titre du quiz</label>
        <input type="text" class="form-control" th:field="*{title}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Phrase avec les trous (utilise ____ pour chaque trou)</label>
        <textarea class="form-control" rows="3" th:field="*{sentence}"
                  placeholder="L'infirmière aide ____ patient qui ____ mal à la tête." required></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Mots à placer (séparés par virgule)</label>
        <input type="text" class="form-control" th:field="*{words}"
               placeholder="le,a,du" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Réponses correctes (dans le bon ordre, séparées par virgule)</label>
        <input type="text" class="form-control" th:field="*{correctAnswers}"
               placeholder="le,a" required>
    </div>

    <button type="submit" class="btn btn-primary btn-lg">Créer le Quiz</button>
    <a th:href="@{/quizzes}" class="btn btn-secondary btn-lg">Retour à la liste</a>
</form>
</div>

<div class="container mt-5">
<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h4 th:text="${exercise.id == null} ? 'Créer un nouvel exercice' : 'Modifier l\'exercice'"></h4>
    </div>
    <div class="card-body">
        <form th:action="@{/admin/exercises}" th:object="${exercise}" method="post">

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label">Type d'exercice</label>
                <select class="form-select" th:field="*{exerciseType}" required>
                    <option value="QCM">QCM (4 choix)</option>
                    <option value="MATCHING">Compléter les phrases (5 mots / 5 phrases)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Leçon associée</label>
                <input type="text" class="form-control" th:field="*{lessonTitle}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Question / Consigne</label>
                <textarea class="form-control" th:field="*{question}" rows="3"></textarea>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label>Option A</label>
                        <input type="text" class="form-control" th:field="*{optionA}">
                    </div>
                    <div class="mb-3">
                        <label>Option B</label>
                        <input type="text" class="form-control" th:field="*{optionB}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label>Option C</label>
                        <input type="text" class="form-control" th:field="*{optionC}">
                    </div>
                    <div class="mb-3">
                        <label>Option D</label>
                        <input type="text" class="form-control" th:field="*{optionD}">
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label>Réponse correcte (QCM)</label>
                <input type="text" class="form-control" th:field="*{correctAnswer}">
            </div>


            <button type="submit" class="btn btn-primary btn-lg">Enregistrer l'exercice</button>
            <a th:href="@{/admin/exercises}" class="btn btn-secondary btn-lg">Annuler</a>
        </form>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
