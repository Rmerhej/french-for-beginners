<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le Thème</title>
    <th:block th:replace="~{fragments/assets :: bootstrap}"></th:block>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-5">
    <h2>Modifier le Thème</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/theme/edit/{id}(id=${theme.id})}" method="post" enctype="multipart/form-data" th:object="${theme}">

        <div class="mb-3">
            <label class="form-label">Titre du thème</label>
            <input type="text" class="form-control" th:field="*{title}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Nom du thème</label>
            <input type="text" class="form-control" th:field="*{nom}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Dialogue</label>
            <textarea class="form-control" rows="3" th:field="*{dialogueContent}" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label" for="audioFile">Audio</label>
            <div th:if="${theme.audio != null and !theme.audio.isBlank()}" class="mb-2">
                <audio controls th:src="@{${theme.audio}}"></audio>
                <div class="form-text">Audio actuel.</div>
            </div>
            <input class="form-control" type="file" id="audioFile" name="audioFile" accept="audio/*">
            <div class="form-text">Laissez vide pour conserver l'audio actuel (formats : mp3, wav, ogg, m4a). L'ancien fichier est supprimé quand vous en envoyez un nouveau.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Enregistrer les modifications</button>
        <a th:href="@{/themes}" class="btn btn-secondary btn-lg">Annuler</a>
    </form>
</div>
<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
