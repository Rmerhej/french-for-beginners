<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier le Thème</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-5">
    <h2>Modifier le Thème</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/theme/edit/{id}(id=${theme.id})}" method="post" th:object="${theme}">

        <div class="mb-3">
            <label class="form-label">Titre du thème</label>
            <input type="text" class="form-control" th:field="*{title}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Nom du thème</label>
            <input type="text" class="form-control" th:field="*{nom}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Dialogue</label>
            <textarea class="form-control" rows="3" th:field="*{dialogueContent}" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Audio</label>
            <input class="form-control" type="text" th:field="*{audio}" placeholder="/uploads/audio/ou.mp3">
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Enregistrer les modifications</button>
        <a th:href="@{/themes}" class="btn btn-secondary btn-lg">Annuler</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
