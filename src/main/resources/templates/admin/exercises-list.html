<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Exercices - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Messages de succès / erreur -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>✍️ Gestion des Exercices</h2>
        <a th:href="@{/admin/exercises/new}" class="btn btn-success">+ Nouvel Exercice</a>
    </div>

    <!-- Barre de recherche -->
    <form th:action="@{/admin/exercises}" method="get" class="mb-4">
        <div class="input-group w-50">
            <input type="text" name="keyword" class="form-control"
                   th:value="${keyword}"
                   placeholder="Rechercher dans la question ou le titre de la leçon...">
            <button type="submit" class="btn btn-primary">🔍 Rechercher</button>
            <a th:href="@{/admin/exercises}" class="btn btn-secondary">Effacer</a>
        </div>
    </form>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Leçon</th>
            <th>Question</th>
            <th>Bonne Réponse</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ex : ${exercises}">
            <td th:text="${ex.id}"></td>
            <td th:text="${ex.lessonTitle}"></td>
            <td th:text="${#strings.abbreviate(ex.question, 70)}"></td>
            <td><strong class="text-success" th:text="${ex.correctAnswer}"></strong></td>
            <td>
                <a th:href="@{/admin/exercises/edit/{id}(id=${ex.id})}" class="btn btn-warning btn-sm">Modifier</a>
                <a th:href="@{/admin/exercises/delete/{id}(id=${ex.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Supprimer cet exercice ?')">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <nav th:if="${exercisesPage}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${exercisesPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/exercises(page=${exercisesPage.number - 1}, size=${exercisesPage.size}, keyword=${keyword})}">
                    Précédent
                </a>
            </li>

            <li th:each="p : ${#numbers.sequence(0, exercisesPage.totalPages - 1)}"
                class="page-item"
                th:classappend="${p == exercisesPage.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/admin/exercises(page=${p}, size=${exercisesPage.size}, keyword=${keyword})}"
                   th:text="${p + 1}"></a>
            </li>

            <li class="page-item" th:classappend="${exercisesPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/exercises(page=${exercisesPage.number + 1}, size=${exercisesPage.size}, keyword=${keyword})}">
                    Suivant
                </a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
