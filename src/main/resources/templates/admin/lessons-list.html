<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Leçons - Admin</title>
    <th:block th:replace="~{fragments/assets :: bootstrap}"></th:block>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
   <!-- <link th:href="@{/css/style.css}" rel="stylesheet">-->
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Messages du serveur affichés en notification (voir js/toast.js) -->
<div hidden th:if="${success}" data-ffb-toast="success" th:text="${success}"></div>
<div hidden th:if="${error}" data-ffb-toast="error" th:text="${error}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📚 Gestion des Leçons</h2>
        <a th:href="@{/admin/lessons/new}" class="btn btn-success">+ Nouvelle Leçon</a>
    </div>

    <form th:action="@{/admin/lessons}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="keyword" class="form-control"
                   th:value="${keyword}" placeholder="Rechercher par titre...">
            <button type="submit" class="btn btn-primary">🔍 Rechercher</button>
            <a th:href="@{/admin/lessons}"
               class="btn btn-secondary">Effacer</a>
        </div>
    </form>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Titre</th>
            <th>Niveau</th>
            <th>Catégorie</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lesson : ${lessons}">
            <td th:text="${lesson.id}"></td>
            <td th:text="${lesson.title}"></td>
            <td th:text="${lesson.level}"></td>
            <td th:text="${lesson.category}"></td>
            <td>
                <a th:href="@{/admin/lessons/edit/{id}(id=${lesson.id})}" class="btn btn-warning btn-sm">Modifier</a>
              <!--  <a th:href="@{/admin/lessons/delete/{id}(id=${lesson.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette leçon ?')">
                    Supprimer
                </a>-->
                <form th:action="@{/admin/lessons/delete/{id}(id=${lesson.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Supprimer cette leçon ?');">
                    <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/pagination :: pagination(${lessonsPage}, '/admin/lessons', ${keyword})}"></div>
</div>
<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
