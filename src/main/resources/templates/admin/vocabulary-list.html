<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion du Vocabulaire - Admin</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Messages de succès / erreur -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📝 Gestion du Vocabulaire</h2>
        <a th:href="@{/admin/vocabulary/new}" class="btn btn-success">+ Nouveau Mot</a>
    </div>

    <!-- Barre de recherche -->
    <form th:action="@{/admin/vocabulary}" method="get" class="mb-4">
        <div class="input-group w-50">
            <input type="text" name="keyword" class="form-control"
                   th:value="${keyword}" placeholder="Rechercher par mot français ou traduction...">
            <button type="submit" class="btn btn-primary">🔍 Rechercher</button>
            <a th:href="@{/admin/vocabulary}" class="btn btn-secondary">Effacer</a>
        </div>
    </form>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Mot Français</th>
            <th>Traduction</th>
            <th>Leçon</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="word : ${vocabularies}">
            <td th:text="${word.id}"></td>
            <td><strong th:text="${word.frenchWord}"></strong></td>
            <td th:text="${word.englishTranslation}"></td>
            <td th:text="${word.lesson != null ? word.lesson.title : 'Non lié'}"></td>
            <td>
                <a th:href="@{/admin/vocabulary/edit/{id}(id=${word.id})}" class="btn btn-warning btn-sm">Modifier</a>
                <a th:href="@{/admin/vocabulary/delete/{id}(id=${word.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Supprimer ce mot ?')">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <nav th:if="${vocabPage}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${vocabPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/vocabulary(page=${vocabPage.number - 1}, size=${vocabPage.size}, keyword=${keyword})}">Précédent</a>
            </li>
            <li th:each="p : ${#numbers.sequence(0, vocabPage.totalPages - 1)}"
                class="page-item" th:classappend="${p == vocabPage.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/vocabulary(page=${p}, size=${vocabPage.size}, keyword=${keyword})}" th:text="${p + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${vocabPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/vocabulary(page=${vocabPage.number + 1}, size=${vocabPage.size}, keyword=${keyword})}">Suivant</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
