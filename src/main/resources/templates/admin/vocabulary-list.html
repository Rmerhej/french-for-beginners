<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gérer le Vocabulaire</title>
    <th:block th:replace="~{fragments/assets :: bootstrap}"></th:block>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gérer le Vocabulaire</h2>
        <a th:href="@{/admin/vocabulary/new}" class="btn btn-success">+ Nouveau mot</a>
    </div>


    <form th:action="@{/admin/vocabulary}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text"
                   class="form-control"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Rechercher un mot français ou sa traduction...">
            <button class="btn btn-primary" type="submit">Rechercher</button>
            <a th:href="@{/admin/vocabulary}" class="btn btn-secondary">Effacer</a>
        </div>
    </form>

    <div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Mot (FR)</th>
            <th>Traduction (EN)</th>
            <th>Leçon</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="word : ${vocabularies}">
            <td th:text="${word.frenchWord}"></td>
            <td th:text="${word.englishTranslation}"></td>
            <td th:text="${word.lesson?.title}"></td>
            <td>
                <a th:href="@{/admin/vocabulary/edit/{id}(id=${word.id})}" class="btn btn-sm btn-primary">Modifier</a>
               <!-- <a th:href="@{/admin/vocabulary/delete/{id}(id=${word.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Supprimer ce mot ?')">Supprimer</a>-->
                <form th:action="@{/admin/vocabulary/delete/{id}(id=${word.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Supprimer ce mot ?');">
                    <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </div>

    <div th:replace="~{fragments/pagination :: pagination(${vocabularyPage}, '/admin/vocabulary', ${keyword})}"></div>

    <div th:if="${vocabularies.isEmpty()}" class="alert alert-info text-center">
        Aucun résultat trouvé.
    </div>
</div>
<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
