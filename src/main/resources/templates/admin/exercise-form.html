<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${exercise.id == null} ? 'Nouvel Exercice' : 'Modifier Exercice'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${exercise.id == null} ? 'Créer un nouvel exercice' : 'Modifier l\'exercice'"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/exercises}" th:object="${exercise}" method="post">

                <input type="hidden" th:field="*{id}" />

                <!-- Type d'exercice -->
                <div class="mb-3">
                    <label class="form-label">Type d'exercice</label>
                    <select class="form-select" th:field="*{exerciseType}" required>
                        <option value="QCM">QCM (4 choix)</option>
                        <option value="MATCHING">Compléter les phrases (5 mots / 5 phrases)</option>
                    </select>
                </div>

                <!-- Titre de la leçon -->
                <div class="mb-3">
                    <label class="form-label">Leçon associée</label>
                    <input type="text" class="form-control" th:field="*{lessonTitle}" required>
                </div>

                <!-- Question (pour QCM) -->
                <div class="mb-3">
                    <label class="form-label">Question / Consigne</label>
                    <textarea class="form-control" th:field="*{question}" rows="3"></textarea>
                </div>

                <!-- Champs QCM -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label>Option A</label>
                            <input type="text" class="form-control" th:field="*{optionA}">
                        </div>
                        <div class="mb-3">
                            <label>Option B</label>
                            <input type="text" class="form-control" th:field="*{optionB}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label>Option C</label>
                            <input type="text" class="form-control" th:field="*{optionC}">
                        </div>
                        <div class="mb-3">
                            <label>Option D</label>
                            <input type="text" class="form-control" th:field="*{optionD}">
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Réponse correcte (QCM)</label>
                    <input type="text" class="form-control" th:field="*{correctAnswer}">
                </div>

                <!-- Nouveau : MATCHING -->
                <div class="mb-3">
                    <label>5 Mots (séparés par ; )</label>
                    <textarea class="form-control" th:field="*{words}" rows="2"
                              placeholder="pomme;chat;maison;voiture;livre"></textarea>
                </div>

                <div class="mb-3">
                    <label>5 Phrases avec un mot manquant (séparées par ; )</label>
                    <textarea class="form-control" th:field="*{sentences}" rows="4"
                              placeholder="Je mange une ___ rouge.;Le ___ dort sur le lit.; etc."></textarea>
                </div>

                <div class="mb-3">
                    <label>Explication / Correction</label>
                    <textarea class="form-control" th:field="*{explanation}" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-lg">Enregistrer l'exercice</button>
                <a th:href="@{/admin/exercises}" class="btn btn-secondary btn-lg">Annuler</a>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
