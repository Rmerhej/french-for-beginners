<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Créer un nouveau Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-5">
    <h2>Créer un nouveau Quiz</h2>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/quiz/create}" method="post" th:object="${quiz}">
        <div class="mb-3">
            <label class="form-label">Titre du quiz</label>
            <input type="text" class="form-control" th:field="*{title}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phrase avec les trous (utilise ____ pour chaque trou)</label>
            <textarea class="form-control" rows="3" th:field="*{sentence}"
                      placeholder="L'infirmière aide ____ patient qui ____ mal à la tête." required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Mots à placer (séparés par virgule)</label>
            <input type="text" class="form-control" th:field="*{words}"
                   placeholder="le,a,du" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Réponses correctes (dans le bon ordre, séparées par virgule)</label>
            <input type="text" class="form-control" th:field="*{correctAnswers}"
                   placeholder="le,a" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">Créer le Quiz</button>
        <a th:href="@{/admin/quizzes}" class="btn btn-secondary btn-lg">Retour à la liste</a>
    </form>
</div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
