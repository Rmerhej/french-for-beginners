<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer Utilisateur</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h2>➕ Créer un utilisateur</h2>

    <div class="card shadow mt-4">
        <div class="card-body">

            <form th:action="@{/admin/users/save}" th:object="${user}" method="post">

                <!-- username -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nom d'utilisateur</label>
                        <input type="text" class="form-control"
                               th:field="*{username}"
                               placeholder="Entrer un username" required />
                    </div>

                    <!-- email -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control"
                               th:field="*{email}"
                               placeholder="Entrer un email" required />
                    </div>
                </div>

                <!-- password -->
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-control"
                           th:field="*{password}"
                           placeholder="Entrer un mot de passe" required />
                </div>

                <!-- role -->
                <div class="mb-3">
                    <label class="form-label">Rôle</label>
                    <select class="form-select" th:field="*{role}">
                        <option value="USER">Utilisateur</option>
                        <option value="ADMIN">Administrateur</option>
                    </select>
                </div>

                <!-- enabled -->
                <div class="mb-3">
                    <label class="form-label">Statut du compte</label>

                    <div class="form-check form-switch">
                        <input class="form-check-input"
                               type="checkbox"
                               th:field="*{enabled}"
                               id="enabledSwitch">

                        <label class="form-check-label" for="enabledSwitch">
                            Activer le compte
                        </label>
                    </div>
                </div>

                <!-- buttons -->
                <div class="mt-4">
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary btn-lg me-3">Créér</button>
                        <a th:href="@{/users}" class="btn btn-secondary btn-lg">Annuler</a>
                    </div>
                </div>

            </form>

        </div>
    </div>

</div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
