<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Utilisateurs - Admin</title>
    <th:block th:replace="~{fragments/assets :: bootstrap}"></th:block>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Messages du serveur affichés en notification (voir js/toast.js) -->
<div hidden th:if="${success}" data-ffb-toast="success" th:text="${success}"></div>
<div hidden th:if="${error}" data-ffb-toast="error" th:text="${error}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👥 Gestion des Utilisateurs</h2>
        <a th:href="@{user/new}" class="btn btn-success">
            Nouveau utilisateur
        </a>

        <!-- <a th:href="@{/admin/users/edit/0}" class="btn btn-success">+ Nouvel Utilisateur</a>-->
    </div>

    <form th:action="@{/admin/users}" method="get" class="mb-4">
        <div class="input-group w-50">
            <input type="text" name="keyword" class="form-control"
                   th:value="${keyword}" placeholder="Rechercher par username ou email...">
            <button type="submit" class="btn btn-primary">Rechercher</button>
            <a th:href="@{/admin/users}" class="btn btn-secondary">Effacer</a>
        </div>
    </form>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Statut</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td>
                        <span class="badge" th:classappend="${user.role == 'ADMIN'} ? 'bg-danger' : 'bg-primary'">
                            <span th:text="${user.role}"></span>
                        </span>
            </td>
            <td>
                        <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-secondary'"
                              th:text="${user.enabled ? 'Actif' : 'Désactivé'}"></span>
            </td>
            <td>
                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-warning btn-sm">Modifier</a>
               <!-- <a th:href="@{/admin/users/toggle/{id}(id=${user.id})}" class="btn btn-info btn-sm">Act/Désact</a>-->
                <form th:action="@{/admin/users/toggle/{id}(id=${user.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-info btn-sm">Act/Désact</button>
                </form>
                <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Supprimer cet utilisateur ?');">
                    <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/pagination :: pagination(${usersPage}, '/admin/users', ${keyword})}"></div>
</div>
<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
