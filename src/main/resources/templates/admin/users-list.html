<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion Utilisateurs - Admin</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Messages de succès / erreur -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👥 Gestion des Utilisateurs</h2>
        <a th:href="@{/admin/users/edit/0}" class="btn btn-success">+ Nouvel Utilisateur</a>
    </div>

    <!-- Recherche -->
    <form th:action="@{/admin/users}" method="get" class="mb-4">
        <div class="input-group w-50">
            <input type="text" name="keyword" class="form-control"
                   th:value="${keyword}" placeholder="Rechercher par username ou email...">
            <button type="submit" class="btn btn-primary">Rechercher</button>
            <a th:href="@{/admin/users}" class="btn btn-secondary">Effacer</a>
        </div>
    </form>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Statut</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td>
                        <span class="badge" th:classappend="${user.role == 'ADMIN'} ? 'bg-danger' : 'bg-primary'">
                            <span th:text="${user.role}"></span>
                        </span>
            </td>
            <td>
                        <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-secondary'"
                              th:text="${user.enabled ? 'Actif' : 'Désactivé'}"></span>
            </td>
            <td>
                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-warning btn-sm">Modifier</a>
                <a th:href="@{/admin/users/toggle/{id}(id=${user.id})}" class="btn btn-info btn-sm">Act/Désact</a>
                <a th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Supprimer cet utilisateur ?')">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <nav th:if="${usersPage}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${usersPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/users(page=${usersPage.number - 1}, size=${usersPage.size}, keyword=${keyword})}">Précédent</a>
            </li>

            <li th:each="pageNum : ${#numbers.sequence(0, usersPage.totalPages - 1)}"
                class="page-item"
                th:classappend="${pageNum == usersPage.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/admin/users(page=${pageNum}, size=${usersPage.size}, keyword=${keyword})}"
                   th:text="${pageNum + 1}"></a>
            </li>

            <li class="page-item" th:classappend="${usersPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/users(page=${usersPage.number + 1}, size=${usersPage.size}, keyword=${keyword})}">Suivant</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
