<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lesson.id == null} ? 'Nouvelle Leçon' : 'Modifier Leçon'"></title>
    <th:block th:replace="~{fragments/assets :: bootstrap}"></th:block>
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <h2 th:text="${lesson.id == null} ? 'Créer une nouvelle leçon' : 'Modifier la leçon'"></h2>

    <form th:action="@{/admin/lessons}" th:object="${lesson}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label>Titre</label>
            <input type="text" class="form-control" th:field="*{title}" required/>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label>Niveau</label>
                    <select class="form-control" th:field="*{level}">
                        <option value="A1">A1 - Débutant</option>
                        <option value="A2">A2</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label>Catégorie</label>
                    <input type="text" class="form-control" th:field="*{category}"/>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label>Contenu</label>
            <textarea class="form-control" rows="6" th:field="*{content}"></textarea>
        </div>

        <div class="mb-3">
            <label>Image de la leçon</label>
            <input type="file" class="form-control" name="imageFile" accept="image/*"/>
            <small class="text-secondary" th:if="${lesson.imageUrl}">
                Image actuelle : <a th:href="${lesson.imageUrl}" target="_blank">Voir</a>
            </small>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/admin/lessons}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
