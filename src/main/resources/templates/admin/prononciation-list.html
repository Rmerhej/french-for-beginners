<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Liste des Prononciations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1 class="text-primary">Liste des prononciations</h1>

    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/prononciation/ajouter}" class="btn btn-success mb-3">+
        Nouvelle prononciation</a>


    <table class="table table-bordered">


        <thead>

        <tr>

            <th>
                Son
            </th>

            <th>
                Exemple
            </th>

            <th>
                Audio
            </th>

            <th>
                Actions
            </th>


        </tr>

        </thead>


        <tbody>


        <tr th:each="item : ${prononciations}">


            <td th:text="${item.son}"></td>


            <td th:text="${item.exemple}"></td>


            <td th:text="${item.audio}"></td>

            <td>

                <a class="btn btn-warning btn-sm" th:href="@{/admin/prononciation/modifier/{id}(id=${item.id})}">
                    Modifier
                </a>

                <a class="btn btn-danger btn-sm" th:href="@{/admin/prononciation/supprimer/{id}(id=${item.id})}"
                   onclick="return confirm('Supprimer cette prononciation ?');">
                    Supprimer
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
