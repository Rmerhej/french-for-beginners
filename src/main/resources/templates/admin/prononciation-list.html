<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Prononciations</title>
    <th:block th:replace="~{fragments/assets :: bootstrap}"></th:block>
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <h1 class="text-primary">Liste des prononciations</h1>

    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/prononciation/ajouter}" class="btn btn-success mb-3">+
        Nouvelle prononciation</a>


    <div class="table-responsive">
    <table class="table table-bordered">


        <thead>

        <tr>

            <th>
                Son
            </th>

            <th>
                Exemple
            </th>

            <th>
                Audio
            </th>

            <th>
                Actions
            </th>


        </tr>

        </thead>


        <tbody>


        <tr th:each="item : ${prononciations}">


            <td th:text="${item.son}"></td>


            <td th:text="${item.exemple}"></td>


            <td th:text="${item.audio}"></td>

            <td>

                <a class="btn btn-warning btn-sm" th:href="@{/admin/prononciation/modifier/{id}(id=${item.id})}">
                    Modifier
                </a>

                <!--<a class="btn btn-danger btn-sm" th:href="@{/admin/prononciation/supprimer/{id}(id=${item.id})}"
                   onclick="return confirm('Supprimer cette prononciation ?');">
                    Supprimer
                </a>-->
                <form th:action="@{/admin/prononciation/supprimer/{id}(id=${item.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Supprimer cette prononciation ?');">
                    <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                </form>

            </td>

        </tr>

        </tbody>

    </table>
    </div>

    <div th:replace="~{fragments/pagination :: pagination(${prononciationsPage}, '/admin/prononciationsDashboard', null)}"></div>

</div>

<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
