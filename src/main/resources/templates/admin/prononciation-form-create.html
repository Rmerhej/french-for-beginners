<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Prononciation-form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1 th:text="${titre}"></h1>

<form th:action="@{/admin/prononciation/enregistrer}" th:object="${prononciation}"
      method="post">

    <div class="mb-3">

        <label class="form-label">Son</label>

        <input class="form-control" type="text" th:field="*{son}" placeholder="Exemple : ou, on, ch">

    </div>

    <div class="mb-3">

        <label class="form-label">Exemple</label>

        <textarea class="form-control" th:field="*{exemple}" rows="3"
                  placeholder="Exemple : bouche, couture"></textarea>

    </div>

    <div class="mb-3">

        <label class="form-label">Fichier audio</label>

        <input class="form-control" type="text" th:field="*{audio}" placeholder="/uploads/audio/ou.mp3">

    </div>

    <button class="btn btn-success">Enregistrer</button>

    <a href="/admin/prononciation" class="btn btn-secondary">Annuler</a>

</form>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
