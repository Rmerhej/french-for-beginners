<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title th:text="${titre}">Prononciation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">

    <h1 th:text="${titre}"></h1>

    <form th:action="@{/admin/prononciation/enregistrer}" th:object="${prononciation}" method="post" enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Son</label>
            <input class="form-control" type="text" th:field="*{son}" placeholder="Exemple : ou, on, ch">
        </div>

        <div class="mb-3">
            <label class="form-label">Exemple</label>
            <textarea class="form-control" th:field="*{exemple}" rows="3"
                      placeholder="Exemple : bouche, couture"></textarea>
        </div>

        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Audio (prononciation)</label>
                <input type="file" class="form-control" name="audioFile" accept="audio/*">
            </div>
        </div>

            <button type="submit" class="btn btn-success">
                Enregistrer
            </button>

            <a th:href="@{/admin/prononciationsDashboard}" class="btn btn-secondary">
                Annuler
            </a>
        
    </form>

</main>

<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
