<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dropzone {
            display: inline-block; width: 160px; height: 50px; border: 2px dashed #6c757d;
            text-align: center; vertical-align: middle; background: #f8f9fa;
            border-radius: 8px; margin: 0 6px; font-size: 1.1em;
        }
        .dropzone.over { background: #d1e7dd; border-color: #198754; }
        .word {
            display: inline-block; padding: 12px 18px; margin: 6px;
            background: #0d6efd; color: white; border-radius: 8px;
            cursor: grab; font-weight: bold;
        }
        .word.dragging { opacity: 0.5; }
    </style>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-5">
    <h2 th:text="${quiz.title}"></h2>

    <div class="card mb-4">
        <div class="card-header">Mots à placer (glisse-les)</div>
        <div class="card-body" id="wordsContainer"></div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Complète la phrase :</div>
        <div class="card-body fs-4 lh-lg" id="sentence" th:utext="${quiz.sentence}"></div>
    </div>

    <button class="btn btn-success btn-lg me-3" onclick="checkAnswers()">Vérifier mes réponses</button>
    <button class="btn btn-secondary btn-lg" onclick="resetQuiz()">Recommencer</button>

    <div id="feedback" class="mt-4"></div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const words = /*[[${words}]]*/ [];
    const correctAnswers = /*[[${correctAnswers}]]*/ [];

    function prepareSentence() {
        const sentenceContainer = document.getElementById('sentence');
        // On remplace les ____ par la dropzone
        sentenceContainer.innerHTML = sentenceContainer.innerHTML.replace(/____/g, '<span class="dropzone"></span>');
    }

    function initDragAndDrop() {
        const container = document.getElementById('wordsContainer');
        container.innerHTML = '';

        words.forEach(word => {
            const div = document.createElement('div');
            div.className = 'word';
            div.draggable = true;
            div.textContent = word.trim();
            div.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.textContent);
                e.target.classList.add('dragging');
            });
            div.addEventListener('dragend', (e) => e.target.classList.remove('dragging'));
            container.appendChild(div);
        });

        document.querySelectorAll('.dropzone').forEach(zone => {
            zone.addEventListener('dragover', (e) => { e.preventDefault(); e.currentTarget.classList.add('over'); });
            zone.addEventListener('dragleave', (e) => e.currentTarget.classList.remove('over'));
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.currentTarget.textContent = e.dataTransfer.getData('text/plain');
                e.currentTarget.classList.remove('over');
            });
        });
    }

    function dragStart(e) {
        e.dataTransfer.setData('text/plain', e.target.textContent);
        e.target.classList.add('dragging');
    }
    function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('over'); }
    function dragLeave(e) { e.currentTarget.classList.remove('over'); }
    function drop(e) {
        e.preventDefault();
        e.currentTarget.textContent = e.dataTransfer.getData('text/plain');
        e.currentTarget.classList.remove('over');
    }
   function checkAnswers() {
        const zones = document.querySelectorAll('.dropzone');
        let score = 0;
        let filled = true;
   zones.forEach((zone, i) => {
            const answer = zone.textContent.trim();
            if (!answer) filled = false;
            if (answer === correctAnswers[i]) {
                zone.style.backgroundColor = '#d1e7dd';
                zone.style.borderColor = '#198754';
                score++;
            } else {
                zone.style.backgroundColor = '#f8d7da';
                zone.style.borderColor = '#dc3545';
            }
        });

        const fb = document.getElementById('feedback');
        if (!filled) {
            fb.innerHTML = `<div class="alert alert-warning">Remplis toutes les cases !</div>`;
        } else if (score === correctAnswers.length) {
            fb.innerHTML = `<div class="alert alert-success"><strong>Bravo !</strong> Tu as tout juste.</div>`;
        } else {
            fb.innerHTML = `<div class="alert alert-info">Tu as ${score}/${correctAnswers.length} bonnes réponses.</div>`;
        }
    }

    function resetQuiz() {
        document.querySelectorAll('.dropzone').forEach(z => {
            z.textContent = '';
            z.style.backgroundColor = '';
            z.style.borderColor = '';
        });
        document.getElementById('feedback').innerHTML = '';
    }

    //function checkAnswers() { /* ... votre logique actuelle ... */ }
   // function resetQuiz() { /* ... votre logique actuelle ... */ }
window.checkAnswers = checkAnswers;
    window.resetQuiz = resetQuiz;
    // Initialisation unique et propre
    window.onload = function() {
        prepareSentence();
        initDragAndDrop();
    };
    /*]]>*/
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
