<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz</title>
    <th:block th:replace="~{fragments/assets :: bootstrap}"></th:block>
    <link rel="stylesheet" th:href="@{/css/quiz-dropzone.css}">
</head>
<body>
<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="container py-5">
    <h1 class="visually-hidden">Quiz</h1>
    <h2 th:text="${quiz.title}"></h2>
    <div class="card mb-4">
        <div class="card-header">Mots à placer (glisse-les)</div>
        <div class="card-body" id="wordsContainer"></div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Complète la phrase :</div>
        <div class="card-body fs-4 lh-lg" id="sentence" th:utext="${quiz.sentence}"></div>
    </div>

    <button class="btn btn-success btn-lg me-3" data-click="checkAnswers">Vérifier mes réponses</button>
    <button class="btn btn-secondary btn-lg" data-click="resetQuiz">Recommencer</button>

    <div id="feedback" class="mt-4"></div>
</main>

<!-- Données du quiz lues par js/quiz-simple.js -->
<ul id="quiz-words" hidden><li th:each="w : ${words}" th:text="${w}"></li></ul>
<ul id="quiz-answers" hidden><li th:each="a : ${correctAnswers}" th:text="${a}"></li></ul>
<script th:src="@{/js/quiz-simple.js}"></script>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>
</body>
</html>
