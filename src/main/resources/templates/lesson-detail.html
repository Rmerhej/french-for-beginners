<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lesson.title}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<button
        type="button"
        class="btn btn-outline-secondary float-end"
        onclick="history.back()">
    <i class="bi bi-arrow-left"></i> Retour
</button>
<div class="container mt-5">
    <a th:href="@{/lessons}" class="btn btn-secondary mb-3">← Retour aux leçons</a>

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 th:text="${lesson.title}"></h3>
            <p th:text="${lesson.level} + ' • ' + ${lesson.category}"></p>
        </div>

        <div class="card-body">
            <img th:if="${lesson.imageUrl}" th:src="${lesson.imageUrl}"
                 class="img-fluid rounded mb-4" style="max-height: 300px; width: 100%; object-fit: cover;">

            <h5>Contenu de la leçon :</h5>
            <p class="lead" th:text="${lesson.content}"></p>
        </div>

        <div class="card-footer bg-light">
            <div class="row text-center">
                <div class="col">
                    <a th:href="@{/lesson/{id}/vocabulary(id=${lesson.id})}"
                       class="btn btn-primary btn-lg w-100">
                        📝 Voir le Vocabulaire
                    </a>
                </div>
                <div class="col">
                    <a th:href="@{/lesson/{id}/exercises(id=${lesson.id})}"
                       class="btn btn-success btn-lg w-100">
                        ✍️ Faire les Exercices
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
