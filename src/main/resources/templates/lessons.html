<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leçons - Français Débutant</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <h1 class="mb-4">📚 Nos Leçons</h1>

    <div class="row">
        <div th:each="lesson : ${lessons}" class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100 shadow-sm">
                <img th:if="${lesson.imageUrl}" th:src="${lesson.imageUrl}"
                     class="card-img-top" style="height: 180px; object-fit: cover;" alt="Image leçon">

                <div class="card-body">
                    <h5 class="card-title" th:text="${lesson.title}"></h5>
                    <p class="badge bg-secondary" th:text="${lesson.level} + ' - ' + ${lesson.category}"></p>

                    <p class="card-text" th:text="${#strings.length(lesson.content) > 80 ?
                            #strings.substring(lesson.content, 0, 80) + '...' : lesson.content}"></p>
                </div>

                <div class="card-footer bg-white">
                    <div class="d-grid gap-2">
                        <a th:href="@{/lesson/{id}(id=${lesson.id})}"
                           class="btn btn-outline-primary">Voir la leçon</a>

                        <a th:href="@{/lesson/{id}/vocabulary(id=${lesson.id})}"
                           class="btn btn-primary">📝 Vocabulaire</a>

                        <a th:href="@{/lesson/{id}/exercises(id=${lesson.id})}"
                           class="btn btn-success">✍️ Exercices</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
