<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(title='Toutes les leçons')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <div sec:authorize="isAnonymous()">
        <div class="alert alert-warning text-center p-5">
            <h4>🔒 Accès restreint</h4>
            <p class="lead">Vous devez être connecté pour accéder à toutes les leçons.</p>
            <a th:href="@{/login}" class="btn btn-primary btn-lg me-3">Se connecter</a>
            <a th:href="@{/register}" class="btn btn-success btn-lg">Créer un compte</a>
        </div>
    </div>

    <div sec:authorize="isAuthenticated()">
        <h2 class="mb-4">📚 Toutes les Leçons + Accès aux quiz</h2>
        <div class="col-6">
            <a th:href="@{/quizzesSurLaGrammaire}" class="btn btn-outline-success btn-lg w-100"><span style="color:#87CEEB">Quiz sur la grammaire</span></a>
        </div><br>
        <div class="col-6">
            <a th:href="@{/lessons/preparation-list}" class="btn btn-outline-danger btn-lg w-100"><span> Préparation du cours hebdomadaire</span></a>
        </div><br>
        <div class="col-6">
            <a th:href="@{/preparation-quiz-lesson-vers-index}" class="btn btn-outline-primary btn-lg w-100"><span> Préparation du cours hebdomadaire /Quiz</span></a>
        </div><br>
        <div class="col-6">
            <a th:href="@{/lessons/prononciation}" class="btn btn-outline-warning btn-lg w-100"><span>Prononciation </span></a>
        </div>

        <br>
        <div class="row">
            <div class="col-md-4 mb-4" th:each="lesson : ${lessons}">
                <div class="card h-100 shadow-sm">
                    <img th:if="${lesson.imageUrl}" th:src="${lesson.imageUrl}"
                         class="card-img-top" style="height: 180px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${lesson.title}"></h5>
                        <p class="text-muted" th:text="${lesson.level}"></p>
                        <a th:href="@{/lesson/{id}(id=${lesson.id})}" class="btn btn-primary">Accéder à la leçon</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
