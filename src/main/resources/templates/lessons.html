<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toutes les Leçons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <!-- Message pour les utilisateurs NON connectés -->
    <div sec:authorize="isAnonymous()">
        <div class="alert alert-warning text-center p-5">
            <h4>🔒 Accès restreint</h4>
            <p class="lead">Vous devez être connecté pour accéder à toutes les leçons.</p>
            <a th:href="@{/login}" class="btn btn-primary btn-lg me-3">Se connecter</a>
            <a th:href="@{/register}" class="btn btn-success btn-lg">Créer un compte</a>
        </div>
    </div>

    <!-- Affichage des leçons uniquement pour les connectés -->
    <div sec:authorize="isAuthenticated()">
        <h2 class="mb-4">📚 Toutes les Leçons + Accès aux quiz</h2>
        <div class="col-6">
            <a th:href="@{/quizzes}" class="btn btn-outline-success btn-lg w-100"><span style="color:#87CEEB">Quiz</span></a>
        </div><br><br>
        <div class="row">
            <div class="col-md-4 mb-4" th:each="lesson : ${lessons}">
                <div class="card h-100 shadow-sm">
                    <img th:if="${lesson.imageUrl}" th:src="${lesson.imageUrl}"
                         class="card-img-top" style="height: 180px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${lesson.title}"></h5>
                        <p class="text-muted" th:text="${lesson.level}"></p>
                        <a th:href="@{/lesson/{id}(id=${lesson.id})}" class="btn btn-primary">Accéder à la leçon</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
