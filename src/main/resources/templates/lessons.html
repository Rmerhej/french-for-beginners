
<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(title='Toutes les leçons')}"></head>
<body class="d-flex flex-column min-vh-100">

<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="container my-5 flex-grow-1">

    <div>
        <!-- En-tête de page -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-5 pb-3 border-bottom">
            <div>
                <h1 class="h2 fw-bold mb-1">
                    <span aria-hidden="true" class="text-secondary me-2">📚</span>Toutes les Leçons
                </h1>
                <p class="text-secondary mb-0">Explorez notre catalogue complet de cours de français.</p>
            </div>
        </div>

        <!-- Grille des leçons -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="lesson : ${lessons}">
                <article class="card h-100 border-0 shadow-sm lesson-card" style="border-radius: 16px; overflow: hidden;">

                    <!-- Image de la leçon (si présente) -->
                    <div th:if="${lesson.imageUrl}" class="position-relative">
                        <img th:src="${lesson.imageUrl}"
                             th:alt="'Illustration de la leçon ' + ${lesson.title}"
                             class="card-img-top" style="height: 180px; object-fit: cover;">
                    </div>

                    <div class="card-body d-flex flex-column p-4">
                        <!-- Niveau (Badge) -->
                        <div class="mb-2">
                            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill fw-semibold"
                                  th:if="${lesson.level}" th:text="${lesson.level}">Niveau</span>
                        </div>

                        <!-- Titre -->
                        <h2 class="card-title h5 fw-bold mb-3"><span aria-hidden="true" class="me-2" th:text="${lesson.icon}">💡</span><span th:text="${lesson.title}">Titre de la leçon</span></h2>

                        <!-- Bouton d'action en bas de carte -->
                        <div class="mt-auto pt-3">
                            <a th:href="@{/lesson/{id}(id=${lesson.id})}"
                               class="btn btn-outline-primary btn-sm rounded-pill w-100 py-2 shadow-sm"
                               th:aria-label="'Accéder à la leçon ' + ${lesson.title}">
                                Accéder à la leçon
                            </a>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>

<link rel="stylesheet" th:href="@{/css/lessons-page.css}">
</body>
</html>
