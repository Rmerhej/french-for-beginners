<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head th:replace="~{fragments/head :: head(title='Préparation du cours Quiz_List')}"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="mb-5">
    <main id="main-content" class="container">
        <div class="mb-5">
            <h1 class="mb-4"><span aria-hidden="true">📚 </span> Préparation du cours hebdomadaire /Quiz</h1>

            </button>

            <div class="row g-4">

                <div class="col-md-3">
                    <article class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                Au café
                            </h5>
                            <a th:href="@{/AuCaféQuiz}" class="btn btn-primary"
                               aria-label="Voir le quiz Au café">
                                Voir la leçon
                            </a>
                        </div>
                    </article>
                </div>

                <div class="col-md-3">
                    <article class="card h-100">

                            <h5 class="card-title">
                                LES GENS
                            </h5>
                            <a th:href="@{/lesgensquiz}" class="btn btn-primary"

                            </a>

                    </article>
                </div>

                <div class="col-md-3">
                    <article class="card h-100">
                        <div class="card-body">

                                Voir la leçon

                </div>

                <div class="col-md-3">
                    <article class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                L'ENTREPRISE
                            </h5>
                            <a th:href="@{/entrepriseQuiz}" class="btn btn-primary"

                                Voir la leçon
                            </a>

                    </article>
                </div>
                <div class="col-md-3">
                    <article class="card h-100">
                        <div class="card-body">

                            </h5>
                            <a th:href="@{/bricolageQuiz}" class="btn btn-primary"

                <div class="col-md-3">
                    <article class="card h-100">

                            <h5 class="card-title">

                            </a>
                        </div>
                    </article>
                </div>
                <div class="col-md-3">
                    <article class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">
                                La ville
                            </h5>
                            <a th:href="@{/villeQuiz}" class="btn btn-primary"
                               aria-label="Voir le quiz L'Entreprise quiz">
                                Voir la leçon
                            </a>
                        </div>
                    </article>
                </div>

            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
