<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Thème-détail</title>
    <link rel="stylesheet" th:href="@{/css/theme-detail-options.css}">
    <link rel="stylesheet" th:href="@{/css/theme-detail-dropzone.css}">

    <th:block th:replace="~{fragments/assets :: bootstrap}"></th:block>
</head>

<body>
<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="container my-5">
    <h1 th:text="${theme.title}" class="text-secondary"></h1>
    <div class="alert alert-success">
        Score :
        <span id="score">0</span>
        /
        <span id="total">0</span>
    </div>
    <nav class="my-4">
        <a href="#dialogue" class="btn btn-outline-primary me-2" aria-label="Dialogue">1. Dialogue</a>
        <a href="#qcm" class="btn btn-outline-primary me-2" aria-label="QCM">2. QCM</a>
        <a href="#quiz" class="btn btn-outline-primary" aria-label="Quiz">3. Quiz</a>
    </nav>

    <section id="dialogue" class="mb-5">
        <h3>1. Dialogue</h3>
        <div class="card">
            <div class="card-body" style="white-space: pre-line;" th:utext="${theme.dialogueContent}"></div>
        </div>

    </section>
    <section>
        <div class="d-flex align-items-center gap-3">

            <button class="btn btn-primary btn-play">
                <i class="bi bi-play-fill"></i>
            </button>

            <audio class="d-none">
                <source th:src="${theme.audio}" type="audio/mpeg">
            </audio>

            <span>Écouter le dialogue</span>

        </div>

    </section>
    <br>

    <section id="qcm" class="mb-5">
        <h3>2. QCM</h3>
        <div th:each="ex : ${exercises}"
             class="mb-5"
             th:id="'exercise-container-' + ${ex.id}">

            <div class="card shadow-sm">
                <div class="card-header">
                    <strong th:text="${ex.lessonTitle}"></strong>
                </div>
                <fieldset class="card-body">
                    <h5 class="card-title mb-4" th:text="${ex.question}"></h5>

                    <div class="options mb-3">
                        <div class="form-check border rounded p-3 mb-2 d-flex align-items-center option-wrapper">
                            <input class="form-check-input" type="radio" th:name="'answer-' + ${ex.id}"
                                   th:id="'optA-' + ${ex.id}" value="A">
                            <label class="form-check-label w-100 ms-2" th:for="'optA-' + ${ex.id}"
                                   th:text="${ex.optionA}"></label>
                        </div>
                        <div class="form-check border rounded p-3 mb-2 d-flex align-items-center option-wrapper">
                            <input class="form-check-input" type="radio" th:name="'answer-' + ${ex.id}"
                                   th:id="'optB-' + ${ex.id}" value="B">
                            <label class="form-check-label w-100 ms-2" th:for="'optB-' + ${ex.id}"
                                   th:text="${ex.optionB}"></label>
                        </div>
                        <div class="form-check border rounded p-3 mb-2 d-flex align-items-center option-wrapper">
                            <input class="form-check-input" type="radio" th:name="'answer-' + ${ex.id}"
                                   th:id="'optC-' + ${ex.id}" value="C">
                            <label class="form-check-label w-100 ms-2" th:for="'optC-' + ${ex.id}"
                                   th:text="${ex.optionC}"></label>
                        </div>
                        <div class="form-check border rounded p-3 mb-2 d-flex align-items-center option-wrapper">
                            <input class="form-check-input" type="radio" th:name="'answer-' + ${ex.id}"
                                   th:id="'optD-' + ${ex.id}" value="D">
                            <label class="form-check-label w-100 ms-2" th:for="'optD-' + ${ex.id}"
                                   th:text="${ex.optionD}"></label>
                        </div>
                    </div>

                    <button type="button" class="btn btn-primary"
                            th:onclick="submitAndCheck([[${ex.id}]], [[${ex.correctAnswer}]])">
                        Vérifier
                    </button>
                </fieldset>
                <div class="card-footer d-none explanation" th:id="'explanation-' + ${ex.id}">
                    <strong>Explication : </strong> <span th:text="${ex.explanation}"></span>
                </div>
            </div>
        </div>
    </section>
    <!--#############################Quiz#################################-->

    <section id="quiz" class="mb-5">
        <h3>3. Quiz</h3>
        <div th:each="quiz, iter : ${quizzes}" class="quiz-wrapper mb-5 p-4  border rounded">
            <h1 th:text="${quiz.title}">Quiz Title</h1>


            <div class="card mb-4">
                <div class="card-header">Mots à placer</div>
                <div class="card-body words-container" th:data-words="${quiz.words}"></div>
            </div>


            <div class="card mb-4">
                <div class="card-header">Complète la phrase :</div>
                <div class="card-body fs-4 lh-lg sentence-container"
                     th:id="'sentence-' + ${iter.index}"
                     th:data-answers="${quiz.correctAnswers}"
                     th:text="${quiz.sentence}" style="white-space: pre-line;"></div>
            </div>

            <button class="btn btn-success btn-lg me-3" th:onclick="'checkAnswers(' + ${iter.index} + ')'">Vérifier
            </button>
            <button class="btn btn-secondary btn-lg" th:onclick="'resetQuiz(' + ${iter.index} + ')'">Recommencer
            </button>
            <div th:id="'feedback-' + ${iter.index}" class="mt-4"></div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>
<script th:src="@{/js/dragAndDrop.js}"></script>
<script th:src="@{/js/au-bureau.js}"></script>
<script src="/js/audio.js"></script>

</body>
</html>
