<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Niveau approfondissement')}">
    <title>Niveau approfondissement</title>
</head>
<body>
<a href="#main-content" class="skip-link position-absolute bg-primary text-white p-2">
    Aller au contenu principal
</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content"  class="container py-5" >


    <div th:replace="~{fragments/niveau :: entete(3, 'Approfondissement', 'A2 → B2', 'danger')}"></div>

    <div class="row g-4">

        <!-- Carte 1 : Livret du citoyen -->
        <div class="col-md-6">
            <div class="card h-100 border-0 shadow-sm text-center p-2"
                 style="border-radius: 16px; transition: transform 0.3s ease, box-shadow 0.3s ease;">
                <div class="card-body d-flex flex-column align-items-center p-4">
                    <div class="fs-1 mb-2">🇫🇷</div>
                    <h3 class="card-title fw-bold fs-5 mb-2">FRANCE - LIVRET DU CITOYEN 2026</h3>
                    <p class="text-muted small mb-4">Cours + QCM + QUIZ (A2-B1)</p>

                    <a th:href="@{/laFrance}"
                       class="btn btn-outline-success btn-lg px-4 py-2 mt-auto rounded-pill fw-bold w-100">
                        Consulter
                    </a>
                </div>
            </div>
        </div>

        <!-- Carte 2 : QCM Culture Française -->
        <div class="col-md-6">
            <div class="card h-100 border-0 shadow-sm text-center p-2"
                 style="border-radius: 16px; transition: transform 0.3s ease, box-shadow 0.3s ease;">
                <div class="card-body d-flex flex-column align-items-center p-4">
                    <div class="fs-1 mb-2">🏛️</div>
                    <h3 class="card-title fw-bold fs-5 mb-2">QCM Culture Française</h3>
                    <p class="text-muted small mb-4">Niveau B1</p>

                    <a th:href="@{/culture}"
                       class="btn btn-outline-success btn-lg px-4 py-2 mt-auto rounded-pill fw-bold w-100">
                        Tester vos connaissances
                    </a>
                </div>
            </div>
        </div>
        <!---------------------------->

        <!-- Grammaire et conjugaison : niveaux B1 et B2 -->
        <div th:replace="~{fragments/niveau :: supports('B1', 'Expliquer, justifier, supposer, rapporter')}"></div>
        <div th:replace="~{fragments/niveau :: supports('B2', 'Argumenter, nuancer, condenser')}"></div>

    </div>

</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>
</body>
</html>
