<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prépositions de Lieu et de Temps - Français A1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
         body { font-family: 'Segoe UI', system-ui, sans-serif; } .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    </style>
</head>
<body class="container">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<header class="hero py-5 text-center">
    <div class="container">
        <h1 class="display-5 fw-bold">📍 Prépositions de Lieu & de Temps</h1>
    </div>
</header>

<div class="container my-5">
    <h4>Prépositions de lieu</h4>
    <ul>
        <li>à → Je suis à Paris</li>
        <li>en → Je vais en France</li>
        <li>dans → dans la maison</li>
        <li>sur / sous / devant / derrière</li>
    </ul>

    <h4>Prépositions de temps</h4>
    <ul>
        <li>à → à 14 heures</li>
        <li>en → en juin / en 2025</li>
        <li>le / la / les → le lundi, la semaine prochaine</li>
    </ul>
</div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
