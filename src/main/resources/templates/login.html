<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Français Débutant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .form-check-input {
            display: inline-block !important;
            opacity: 1 !important;
            position: relative !important;
        }
    </style>
</head>
<body class="bg-light">
<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<main id="main-content" class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h1 class="text-center mb-4" id="login-title"><span aria-hidden="true">🔑</span> Connexion</h1>

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Identifiants incorrects. Vérifiez votre nom d'utilisateur et mot de passe.
                    </div>
                    <div th:if="${param.success}" class="alert alert-success" role="status">
                        Inscription réussie ! Vous pouvez maintenant vous connecter.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info" role="status">
                        Vous avez été déconnecté avec succès.
                    </div>

                    <form th:action="@{/login}" method="post" aria-labelledby="login-title">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />
                        <div class="mb-3">
                            <label for="username" class="form-label">Nom d'utilisateur :</label>
                            <input type="text" id="username" name="username" class="form-control"
                                   placeholder="Nom d'utilisateur"
                                   autocomplete="username"
                                   required/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mot de passe :</label>
                            <div class="input-group">
                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       id="password"
                                       autocomplete="current-password"
                                       required/>
                                <button class="btn btn-outline-secondary toggle-password-btn"
                                        type="button"
                                        id="togglePassword"
                                        aria-label="Afficher mot de passe"
                                        aria-pressed="false">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <input type="checkbox" name="remember-me">
                            Se souvenir de moi
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">Se connecter</button>

                    </form>
                    <div class="text-center">
                        Pas encore de compte ?
                        <a th:href="@{/register}">S'inscrire</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
