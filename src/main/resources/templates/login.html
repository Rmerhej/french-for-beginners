<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Français Débutant</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4">🔑 Connexion</h3>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Identifiants incorrects. Vérifiez votre nom d'utilisateur et mot de passe.
                    </div>
                    <div th:if="${param.success}" class="alert alert-success">
                        Inscription réussie ! Vous pouvez maintenant vous connecter.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info">
                        Vous avez été déconnecté avec succès.
                    </div>

                    <form th:action="@{/login}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nom d'utilisateur :</label><br>
                            <input type="text" name="username" placeholder="Nom d'utilisateur" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mot de passe :</label>
                            <div class="input-group">
                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       id="password"
                                       required />
                                <button class="btn btn-outline-secondary toggle-password-btn"
                                        type="button"
                                        id="togglePassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Se connecter</button>
                    </form>
                    <div th:if="${param.success}">Inscription réussie ! Connectez-vous.</div>
                    <div class="text-center">
                        Pas encore de compte ?
                        <a th:href="@{/register}">S'inscrire</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
