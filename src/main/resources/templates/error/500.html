<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur</title>
    <th:block th:replace="~{fragments/assets :: bootstrap}"></th:block>
</head>
<body class="bg-light">
<div class="container text-center mt-5">
    <h1 class="display-1 text-danger">500</h1>
    <h2>Erreur interne</h2>
    <p class="lead" th:text="${errorMessage}">Une erreur est survenue. Veuillez réessayer plus tard.</p>
    <a href="/" class="btn btn-primary mt-3">Retour à l'accueil</a>
</div>
</body>
</html>
