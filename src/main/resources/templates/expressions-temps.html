<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Cours de français sur les expressions de temps pour adultes débutants">
    <title>Expressions de temps</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<button
        type="button"
        class="btn btn-outline-secondary float-end"
        onclick="history.back()">
    <i class="bi bi-arrow-left"></i> Retour
</button>
<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="text-primary">Les expressions de temps</h1>
            <p class="lead">Elles permettent de situer une action dans le temps.</p>

            <h3>Exemples</h3>
            <div class="row">
                <div class="col-md-6">
                    <ul class="list-group">
                        <li class="list-group-item">hier</li>
                        <li class="list-group-item">aujourd’hui</li>
                        <li class="list-group-item">demain</li>
                    </ul>
                </div>

                <div class="col-md-6">
                    <ul class="list-group">
                        <li class="list-group-item">la semaine prochaine</li>
                        <li class="list-group-item">dans deux jours</li>
                    </ul>
                </div>
            </div>

            <div class="alert alert-success mt-3">
                Je vais au travail <b>demain</b>.
            </div>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
