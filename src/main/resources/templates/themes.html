<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head('Themes')}"></div>

<body>
<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="container mt-5">
    <h1 class="text-center mb-4">Leçons par Thème</h1>
    <p class="lead text-center mb-5">Apprenez le français dans des situations de la vie réelle .</p>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

        <div class="col" th:each="theme : ${themes}">
            <div class="card h-100 shadow-sm theme-card">   <!-- ajout de la classe pour le CSS -->
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${theme.title}"></h5>
                </div>
                <div class="card-footer bg-white border-0">
                    <a th:href="@{/themes/{nom}(nom=${theme.nom})}"
                       class="btn btn-primary w-100">
                        Commencer la leçon
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>
    .theme-card:hover {
        transform: translateY(-10px);
        transition: all 0.3s ease;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
    }
</style>
</body>
</html>
