<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Thèmes')}"></head>
<body class="d-flex flex-column min-vh-100">

<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="container my-5 flex-grow-1">

    <!-- En-tête moderne -->
    <div class="text-center mb-5">
        <h1 class="text-secondary h2 fw-bold mb-2">
            <span aria-hidden="true" class="me-2">🎯</span>Leçons par Thème
        </h1>
        <p class="text-secondary lead fs-6">Apprenez le français dans des situations de la vie réelle.</p>
    </div>

    <!-- Grille des thèmes -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="theme : ${themes}">
            <article class="card h-100 border-0 shadow-sm theme-card" style="border-radius: 16px;">
                <div class="card-body text-center d-flex flex-column justify-content-center p-4">
                    <div class="fs-1 mb-3" aria-hidden="true" th:text="${icons[theme.id]}">💡</div>
                    <h5 class="card-title fw-bold fs-6 mb-0" th:text="${theme.title}">Titre du thème</h5>
                </div>
                <div class="card-footer  border-0 pb-4 px-4 text-center">
                    <a th:href="@{/themes/{nom}(nom=${theme.nom})}"

                       class="btn btn-outline-primary btn-sm rounded-pill w-100 py-2 shadow-sm"
                       th:aria-label="'Commencer la leçon ' + ${theme.title}">
                        Commencer la leçon
                    </a>
                </div>
            </article>
        </div>
    </div>
</main>

<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>

<link rel="stylesheet" th:href="@{/css/themes-page.css}">
</body>
</html>
