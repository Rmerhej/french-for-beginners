<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title th:text="${titre} + ' - Quiz'">Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/quiz-dropzone.css}">

</head>
<body>
<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="container py-5">
    <h2 class="mb-4"  th:text="'Quiz : ' + ${titre}">Quiz disponibles</h2>

    <div th:if="${quizzes.isEmpty()}" class="alert alert-info">
        Aucun quiz n'est disponible pour le moment.
    </div>

    <div th:each="quiz, iter : ${quizzes}" class="quiz-wrapper mb-5 p-4 border rounded" th:data-quiz-id="${quiz.id}">
        <h1 th:text="${quiz.title}" class="text-secondary">Quiz Title</h1>

        <!-- Mots à placer -->
        <div class="card mb-4">
            <div class="card-header">Mots à placer (glissez-les, ou touchez un mot puis la case)</div>
            <div class="card-body words-container" th:data-words="${quiz.words}"></div>
        </div>

        <!-- Phrase -->
        <div class="card mb-4">
            <div class="card-header">Complète la phrase :</div>
            <div class="card-body fs-4 lh-lg sentence-container"
                 th:id="'sentence-' + ${iter.index}"
                 th:data-answers="${quiz.correctAnswers}"
                 th:utext="${quiz.sentence}"></div>
        </div>

        <button class="btn btn-success btn-lg me-3" th:onclick="'checkAnswers(' + ${iter.index} + ')'">Vérifier</button>
        <button class="btn btn-secondary btn-lg" th:onclick="'resetQuiz(' + ${iter.index} + ')'">Recommencer</button>
        <div th:id="'feedback-' + ${iter.index}" class="mt-4"></div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Présent seulement pour un utilisateur connecté : dragAndDrop.js l'utilise pour proposer l'étape suivante -->
<a id="quiz-next" hidden sec:authorize="isAuthenticated()" th:href="@{/}"></a>
<!-- Sans compte : on renvoie vers la liste des cours -->
<a id="quiz-next" hidden sec:authorize="isAnonymous()" th:href="@{/supports-de-cours}"></a>
<script th:src="@{/js/dragAndDrop.js}"></script>
</body>
</html>
