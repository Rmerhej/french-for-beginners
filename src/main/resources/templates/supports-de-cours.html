<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supports de Cours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">
    <h2 class="mb-4">📚 Supports de Cours</h2>
    <p class="lead mb-5">Choisissez une leçon pour voir son contenu détaillé :</p>

    <div class="card" style="width: 18rem;">
        <div class="card-body">
            <h5 class="card-title">l'adjectif</h5>
            <p class="card-text"></p>
            <a th:href="@{/adjectif}" class="btn btn-primary">voir la leçon</a>
        </div>
    </div><br>
    <div class="card" style="width: 18rem;">
        <div class="card-body">
            <h5 class="card-title">les pronoms</h5>
            <p class="card-text"></p>
            <a th:href="@{/pronoms}" class="btn btn-primary">voir la leçon</a>
        </div>
    </div>

</div>
</body>
</html>
