<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Entreprise-Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="/js/scriptQuizGrammaire.js" defer></script>
    <style>
        .dropzone { display: inline-block; width: 160px; height: 50px; border: 2px dashed #6c757d; text-align: center; vertical-align: middle; background: #f8f9fa; border-radius: 8px; margin: 0 6px; font-size: 1.1em; }
        .dropzone.over { background: #d1e7dd; border-color: #198754; }
        .word { display: inline-block; padding: 12px 18px; margin: 6px; background: #0d6efd; color: white; border-radius: 8px; cursor: grab; font-weight: bold; }
        .word.dragging { opacity: 0.5; }
    </style>
</head>
<body class="container">
<div th:replace="~{fragments/navbar :: navbar}"></div><br>

<div>  <img src="uploads/images/UNITÉ-16-L_entreprise.jpg" height="400" width="800"></div>
<button
        type="button"
        class="btn btn-outline-secondary float-end"
        onclick="history.back()">
    <i class="bi bi-arrow-left"></i> Retour
</button>

<div th:each="quiz, iter : ${quizzes}" class="quiz-wrapper mb-5 p-4 bg-white border rounded">
    <h1 th:text="${quiz.title}">Quiz Title</h1>


    <div class="card mb-4">
        <div class="card-header">Mots à placer (glisse-les)</div>
        <div class="card-body words-container" th:data-words="${quiz.words}"></div>
    </div>


    <div class="card mb-4">
        <div class="card-header">Complète la phrase :</div>
        <div class="card-body fs-4 lh-lg sentence-container"
             th:id="'sentence-' + ${iter.index}"
             th:data-answers="${quiz.correctAnswers}"
             th:text="${quiz.sentence}" style="white-space: pre-line;"></div>
    </div>

    <button class="btn btn-success btn-lg me-3" th:onclick="'checkAnswers(' + ${iter.index} + ')'">Vérifier</button>
    <button class="btn btn-secondary btn-lg" th:onclick="'resetQuiz(' + ${iter.index} + ')'">Recommencer</button>
    <div th:id="'feedback-' + ${iter.index}" class="mt-4"></div>
</div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
