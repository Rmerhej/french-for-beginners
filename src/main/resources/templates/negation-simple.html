<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Négation Simple - Français A1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; } .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    </style>
</head>
<body>
<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<header class="hero py-5 text-center">
    <div class="container">
        <h1 class="display-5 fw-bold"><span aria-hidden="true">📘</span> La Négation Simple</h1>
        <p class="lead">ne ... pas</p>
    </div>
</header>

<main id="main-content" class="container my-5">
    <section aria-labelledby="rule-title">
        <h2 id="rule-title">Règle :</h2>
        <div class="p-4 bg-light rounded" role="note">
            <strong>ne + verbe + pas</strong>
        </div>
    </section>
    <section aria-labelledby="example-title"></section>
    <h2 id="example-title">Exemples :</h2>
    <ul>
        <li>Je parle → Je <strong>ne</strong> parle <strong>pas</strong></li>
        <li>Il est français → Il <strong>n’</strong>est <strong>pas</strong> français</li>
        <li>Nous aimons → Nous <strong>ne</strong> aimons <strong>pas</strong></li>
    </ul>
    </section>
    <div class="alert alert-warning" role="alert">
        Attention : <strong>ne</strong> devient <strong>n’</strong> devant une voyelle.
    </div>

</main>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
