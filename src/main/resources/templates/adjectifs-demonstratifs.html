<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Cours de français sur les adjectifs démonstratifs  pour adultes débutants">
    <title>Adjectifs démonstratifs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<button
        type="button"
        class="btn btn-outline-secondary float-end"
        onclick="history.back()">
    <i class="bi bi-arrow-left"></i> Retour
</button>
<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="text-primary">Les adjectifs démonstratifs</h1>
            <p class="lead">Ils servent à montrer ou désigner quelque chose.</p>

            <h3>Formes</h3>

            <table class="table table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>Forme</th>
                    <th>Usage</th>
                </tr>
                </thead>
                <tbody>
                <tr><td>ce</td><td>masculin singulier</td></tr>
                <tr><td>cet</td><td>masculin + voyelle</td></tr>
                <tr><td>cette</td><td>féminin</td></tr>
                <tr><td>ces</td><td>pluriel</td></tr>
                </tbody>
            </table>

            <h3>Exemples</h3>
            <div class="alert alert-info">
                <b>Ce</b> livre est intéressant.<br>
                <b>Cette</b> voiture est rapide.<br>
                <b>Ces</b> étudiants travaillent bien.
            </div>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
