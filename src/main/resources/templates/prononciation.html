<!doctype html>
<html lang="fr" xmlns="http://www.w3.org/1999/html" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Prononciation')}"></head>
<body class="container">
<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<br>
<button
        type="button"
        class="btn btn-outline-secondary float-end"
        onclick="history.back()"
        aria-label="Retour">
    <i class="bi bi-arrow-left" aria-hidden="true"></i> Retour
</button>

<main id="main-content">

    <h1 class="text-primary">
        <span aria-hidden="true">📘</span> Prononciation française
    </h1>


    <div class="row g-3">


        <div
                class="col-12 col-md-6 col-lg-4"
                th:each="item : ${prononciations}">

            <div class="card h-100">

                <div class="card-header bg-primary text-white">

                    <h2 class="h5" th:text="${item.son}"></h2>

                </div>


                <div class="card-body">


                    <p>Exemple :</p>
                    <p th:text="${item.exemple}">
                    </p>


                    <div class="d-flex align-items-center gap-3">


                        <button class="btn btn-primary btn-play">
                            <i class="bi bi-play-fill"></i>
                        </button>

                        <audio class="d-none">

                            <source th:src="${item.audio}" type="audio/mpeg">

                        </audio>

                        <span>Écouter</span>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/audio.js"></script>
</body>
</html>
