<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Prononciation')}"></head>
<body class="d-flex flex-column min-vh-100">

<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="container my-5 flex-grow-1">

    <!-- En-tête moderne -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-5 pb-3 border-bottom">
        <div class="mb-3 mb-md-0">
            <h1 class="h2 fw-bold mb-1">
                <span aria-hidden="true" class="me-2">🔊</span>Prononciation française
            </h1>
            <p class="text-secondary mb-0">Apprenez à maîtriser les sons et les nuances de la langue française.</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/paires-minimales}" class="btn btn-outline-primary">
                <span aria-hidden="true">👂</span> Paires minimales
            </a>
            <a th:href="@{/liaison-lettres-muettes}" class="btn btn-outline-primary">
                <span aria-hidden="true">🔗</span> Liaison et lettres muettes
            </a>
        </div>
    </div>

    <!-- Grille des sons et prononciations -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="item : ${prononciations}">
            <article class="card h-100 border-0 shadow-sm prononciation-card" style="border-radius: 16px; overflow: hidden;">

                <!-- En-tête de la carte -->
                <div class="card-header bg-primary py-3 px-4 border-0 d-flex align-items-center">
                    <span class="fs-4 me-2" aria-hidden="true">🗣️</span>
                    <h2 class="h5 fw-bold mb-0" th:text="${item.son}">Son</h2>
                </div>

                <!-- Corps de la carte -->
                <div class="card-body d-flex flex-column p-4">
                    <div class="mb-4">
                        <span class="text-secondary small text-uppercase fw-bold d-block mb-1">Exemple :</span>
                        <p class="text-secondary fs-5 fw-semibold  mb-0" th:text="${item.exemple}">Exemple</p>
                    </div>

                    <!-- Lecteur Audio (fichier enregistré) -->
                    <div th:if="${item.audio != null and !item.audio.isBlank()}"
                         class="mt-auto pt-3 border-top d-flex align-items-center gap-3">
                        <button class="btn btn-primary rounded-circle p-2 d-flex align-items-center justify-content-center shadow-sm btn-play" style="width: 42px; height: 42px;" th:aria-label="'Écouter la prononciation de ' + ${item.son}">
                            <i class="bi bi-play-fill fs-5" aria-hidden="true"></i>
                        </button>
                        <audio class="d-none">
                            <source th:src="${item.audio}" type="audio/mpeg">
                        </audio>
                        <span class="text-secondary fw-medium small">Écouter l'exemple</span>
                    </div>

                    <!-- Pas d'enregistrement : lecture avec la voix du navigateur (affichée si l'appareil sait lire à voix haute) -->
                    <div th:unless="${item.audio != null and !item.audio.isBlank()}"
                         class="mt-auto pt-3 border-top">
                        <button type="button" class="btn btn-primary btn-say d-flex align-items-center gap-2"
                                th:data-say="${item.exemple}"
                                th:aria-label="|Écouter les mots d'exemple : ${item.son}|" hidden>
                            <i class="bi bi-volume-up-fill" aria-hidden="true"></i>
                            <span class="say-label">Écouter l'exemple</span>
                        </button>
                    </div>
                </div>
            </article>
        </div>
    </div>

</main>

<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>
<script src="/js/audio.js"></script>
<script th:src="@{/js/say.js}"></script>

<link rel="stylesheet" th:href="@{/css/prononciation-page.css}">
</body>
</html>
