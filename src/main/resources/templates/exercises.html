<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices Interactifs - Français Débutant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .option { cursor: pointer; transition: all 0.3s; }
        .option:hover { background-color: #f8f9fa; }
        .correct { background-color: #d4edda !important; border-color: #198754; }
        .incorrect { background-color: #f8d7da !important; border-color: #dc3545; }
        .score { font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🇫🇷 Français Débutant</a>
        <a class="btn btn-outline-light" href="/lessons">Leçons</a>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">📝 Exercices Interactifs</h1>
    <div class="mb-4">
        <span class="score text-primary">Score : <span id="score">0</span> / <span id="total">0</span></span>
    </div>

    <div th:each="ex : ${exercises}" class="mb-5" th:id="'exercise-container-' + ${ex.id}">
        <div class="card shadow-sm">
            <div class="card-header bg-light">
                <strong th:text="${ex.lessonTitle}"></strong>
            </div>
            <div class="card-body">
                <h5 class="card-title mb-4" th:text="${ex.question}"></h5>

                <div class="options mb-3">
                    <div class="form-check border rounded p-3 mb-2 option-wrapper">
                        <input class="form-check-input mx-2" type="radio" th:name="'answer-' + ${ex.id}" th:id="'optA-' + ${ex.id}" value="A">
                        <label class="form-check-label w-100" th:for="'optA-' + ${ex.id}" th:text="${ex.optionA}"></label>
                    </div>
                    <div class="form-check border rounded p-3 mb-2 option-wrapper">
                        <input class="form-check-input mx-2" type="radio" th:name="'answer-' + ${ex.id}" th:id="'optB-' + ${ex.id}" value="B">
                        <label class="form-check-label w-100" th:for="'optB-' + ${ex.id}" th:text="${ex.optionB}"></label>
                    </div>
                    <div class="form-check border rounded p-3 mb-2 option-wrapper">
                        <input class="form-check-input mx-2" type="radio" th:name="'answer-' + ${ex.id}" th:id="'optC-' + ${ex.id}" value="C">
                        <label class="form-check-label w-100" th:for="'optC-' + ${ex.id}" th:text="${ex.optionC}"></label>
                    </div>
                    <div class="form-check border rounded p-3 mb-2 option-wrapper">
                        <input class="form-check-input mx-2" type="radio" th:name="'answer-' + ${ex.id}" th:id="'optD-' + ${ex.id}" value="D">
                        <label class="form-check-label w-100" th:for="'optD-' + ${ex.id}" th:text="${ex.optionD}"></label>
                    </div>
                </div>

                <button type="button" class="btn btn-primary"
                        th:onclick="submitAndCheck([[${ex.id}]], [[${ex.correctAnswer}]])">
                    <i class="fa-solid fa-circle-check me-2"></i>Vérifier
                </button>
            </div>
            <div class="card-footer d-none explanation" th:text="${ex.explanation}"></div>
        </div>
    </div>

    <input type="hidden" id="csrfToken" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
</div>

<script>
    let score = 0;
    let answered = 0;

    function submitAndCheck(exerciseId, correctAnswer) {
        // 1. Trouver le conteneur de l'exercice actuel
        const container = document.getElementById(`exercise-container-${exerciseId}`);

        // 2. Récupérer l'option cochée (A, B, C ou D)
        const selectedRadio = container.querySelector(`input[name="answer-${exerciseId}"]:checked`);

        // Sécurité : si l'utilisateur n'a rien coché et clique sur vérifier
        if (!selectedRadio) {
            alert("Veuillez sélectionner une réponse avant de vérifier !");
            return;
        }

        const selectedValue = selectedRadio.value; // Ex: "A"
        const selectedWrapper = selectedRadio.closest('.option-wrapper');
        const button = container.querySelector('button');

        // Désactiver le bouton et les radios pour éviter le double-clic
        button.disabled = true;
        container.querySelectorAll('input[type="radio"]').forEach(radio => radio.disabled = true);

        answered++;

        // 3. Logique visuelle (Vert si juste, Rouge si faux)
        if (selectedValue === correctAnswer) {
            selectedWrapper.classList.add('correct');
            score++;
        } else {
            selectedWrapper.classList.add('incorrect');
            // Afficher aussi en vert où était la bonne réponse
            const correctRadio = container.querySelector(`input[value="${correctAnswer}"]`);
            correctRadio.closest('.option-wrapper').classList.add('correct');
        }

        // Afficher l'explication
        container.querySelector('.explanation').classList.remove('d-none');

        // Mettre à jour les compteurs globaux à l'écran
        document.getElementById('score').textContent = score;
        document.getElementById('total').textContent = answered;

        // 4. ENVOI DU SCORE VERS LE SCORECONTROLLER (JAVA)
        // On récupère le texte de la réponse sélectionnée pour l'envoyer au @RequestParam String userAnswer
        const selectedText = selectedWrapper.querySelector('label').textContent.trim();

        const formData = new FormData();
        formData.append("userAnswer", selectedText);

        const csrfToken = document.getElementById("csrfToken")?.value;

        fetch(`/exercise/submit/${exerciseId}`, {
            method: 'POST',
            headers: csrfToken ? { 'X-CSRF-TOKEN': csrfToken } : {},
            body: formData
        })
        .then(response => {
            if (response.ok) {
                console.log(`Exercice ${exerciseId} : Score enregistré en base de données !`);
            } else {
                console.error("Erreur serveur lors de l'enregistrement du score.");
            }
        })
        .catch(error => console.error("Erreur réseau :", error));
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
</body>
</html>
