<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices Interactifs - Français Débutant</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .option { cursor: pointer; transition: all 0.3s; }
        .option:hover { background-color: #f8f9fa; }
        .correct { background-color: #d4edda !important; border-color: #198754; }
        .incorrect { background-color: #f8d7da !important; border-color: #dc3545; }
        .score { font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
<!-- Nouvelle syntaxe recommandée -->
<div th:replace="~{fragments/navbar :: navbar}"></div>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🇫🇷 Français Débutant</a>
        <a class="btn btn-outline-light" href="/lessons">Leçons</a>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">📝 Exercices Interactifs</h1>
    <div class="mb-4">
        <span class="score text-primary">Score : <span id="score">0</span> / <span id="total">0</span></span>
    </div>

    <div th:each="ex : ${exercises}" class="mb-5">
        <div class="card">
            <div class="card-header bg-light">
                <strong th:text="${ex.lessonTitle}"></strong>
            </div>
            <div class="card-body">
                <h5 class="card-title mb-4" th:text="${ex.question}"></h5>

                <div class="options">
                    <div class="option border rounded p-3 mb-2" th:onclick="checkAnswer(this, 'A', [[${ex.id}]], [[${ex.correctAnswer}]])" th:text="${ex.optionA}"></div>
                    <div class="option border rounded p-3 mb-2" th:onclick="checkAnswer(this, 'B', [[${ex.id}]], [[${ex.correctAnswer}]])" th:text="${ex.optionB}"></div>
                    <div class="option border rounded p-3 mb-2" th:onclick="checkAnswer(this, 'C', [[${ex.id}]], [[${ex.correctAnswer}]])" th:text="${ex.optionC}"></div>
                    <div class="option border rounded p-3 mb-2" th:onclick="checkAnswer(this, 'D', [[${ex.id}]], [[${ex.correctAnswer}]])" th:text="${ex.optionD}"></div>
                </div>
            </div>
            <div class="card-footer d-none explanation" th:text="${ex.explanation}"></div>
        </div>
    </div>
</div>

<script>
    let score = 0;
    let answered = 0;
    const total = [[${exercises.size()}]];

    function checkAnswer(element, selected, questionId, correct) {
        if (element.classList.contains('correct') || element.classList.contains('incorrect')) return;

        answered++;
        const parent = element.parentElement;

        // Désactiver toutes les options
        parent.querySelectorAll('.option').forEach(opt => {
            opt.style.pointerEvents = 'none';
            if (opt.textContent.trim() === getOptionText(correct, parent)) {
                opt.classList.add('correct');
            }
        });

        if (selected === correct) {
            element.classList.add('correct');
            score++;
        } else {
            element.classList.add('incorrect');
        }

        // Afficher l'explication
        parent.parentElement.querySelector('.explanation').classList.remove('d-none');

        // Mettre à jour le score
        document.getElementById('score').textContent = score;
        document.getElementById('total').textContent = answered;
    }

    function getOptionText(letter, parent) {
        const options = parent.children;
        if (letter === 'A') return options[0].textContent.trim();
        if (letter === 'B') return options[1].textContent.trim();
        if (letter === 'C') return options[2].textContent.trim();
        if (letter === 'D') return options[3].textContent.trim();
        return '';
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
