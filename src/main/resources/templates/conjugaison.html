<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Conjugaison')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="container my-5 flex-grow-1">


    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-5 pb-3 border-bottom">
        <div class="mb-3 mb-md-0">
            <h1 class="h2 fw-bold mb-1">
                <span aria-hidden="true" class="me-2">⚡</span>Conjugaison française
            </h1>
            <p class="text-muted mb-0">Maîtrisez les temps et les modes de la grammaire française.</p>
        </div>
        <button type="button"
                class="btn btn-outline-secondary rounded-pill px-4 py-2 d-inline-flex align-items-center shadow-sm"
                onclick="history.back()" aria-label="Retour à la page précédente">
            <i class="bi bi-arrow-left me-2" aria-hidden="true"></i> Retour
        </button>
    </div>


    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">


        <div class="col">
            <article class="card h-100 border-0 shadow-sm conjugaison-card" style="border-radius: 16px;">
                <div class="card-body d-flex flex-column p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-1" aria-hidden="true">⏱️</span>
                        <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill fw-semibold">A1</span>
                    </div>
                    <h2 class="card-title h5 fw-bold mb-4">Les verbes être et avoir au présent</h2>
                    <div class="mt-auto pt-3">
                        <a th:href="@{/verbesAuPresent}"
                           class="btn btn-outline-primary btn-sm rounded-pill w-100 py-2 shadow-sm"
                           aria-label="Verbes au présent">
                            Voir la leçon
                        </a>
                    </div>
                </div>
            </article>
        </div>


        <div class="col">
            <article class="card h-100 border-0 shadow-sm conjugaison-card" style="border-radius: 16px;">
                <div class="card-body d-flex flex-column p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-1" aria-hidden="true">🎯</span>
                        <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill fw-semibold">A2</span>
                    </div>
                    <h2 class="card-title h5 fw-bold mb-4">L'impératif</h2>
                    <div class="mt-auto pt-3">
                        <a th:href="@{/imperatif}"
                           class="btn btn-outline-primary btn-sm rounded-pill w-100 py-2 shadow-sm"
                           aria-label="L'impératif">
                            Voir la leçon
                        </a>
                    </div>
                </div>
            </article>
        </div>




        <div class="col">
            <article class="card h-100 border-0 shadow-sm conjugaison-card" style="border-radius: 16px;">
                <div class="card-body d-flex flex-column p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-1" aria-hidden="true">🚀</span>
                        <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill fw-semibold">A2</span>
                    </div>
                    <h2 class="card-title h5 fw-bold mb-4">Le futur simple</h2>
                    <div class="mt-auto pt-3">
                        <a th:href="@{/futursimple}"
                           class="btn btn-outline-primary btn-sm rounded-pill w-100 py-2 shadow-sm"
                           aria-label="Le futur simple">
                            Voir la leçon
                        </a>
                    </div>
                </div>
            </article>
        </div>

    </div>

</main>

<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>
    .conjugaison-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .conjugaison-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.08) !important;
    }
</style>
</body>
</html>
