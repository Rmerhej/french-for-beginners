<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Conjugaison')}"></head>
<body>
<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main id="main-content" class="container mt-5">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0"><span aria-hidden="true">📚</span>Conjugaison </h1>
        <button type="button" class="btn btn-outline-secondary" onclick="history.back()"
                aria-label="Retour à la page précédente">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Retour
        </button>
    </header>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="card-title">Verbes au présent (A1) .</h2>
                    <a th:href="@{/verbesAuPresent}" class="btn btn-primary" aria-label="Verbes au présent">Verbes au
                        présent</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="card-title">l'impératif (A2) .</h2>
                    <a th:href="@{/imperatif}" class="btn btn-primary" aria-label="L'impératif">voir la leçon</a>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="card-title">le passé composé (A2) .</h2>
                    <a th:href="@{/passecompse}" class="btn btn-primary" aria-label="Le passé composé">voir la leçon</a>
                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="card-title">Les verbes réguliers (A1-A2) .</h2>
                    <a th:href="@{/verbesreguliers}" class="btn btn-primary" aria-label="Les verbes réguliers">voir la
                        leçon</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="card-title">Le futur simple (A2) .</h2>
                    <a th:href="@{/futursimple}" class="btn btn-primary" aria-label="Le futur simple">voir la leçon</a>
                </div>
            </div>
        </div>


    </div>
</main>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
