<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lesson.title} + ' - Exercices'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link th:href="@{/css/style.css}" type="text/css" rel="stylesheet">
</head>
<body>
<head>
    <meta th:if="${_csrf}" th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf}" th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h2 th:text="${lesson.title}"></h2>
    <h4 class="text-primary">Exercices</h4>

    <div th:if="${exercises.isEmpty()}" class="alert alert-info">
        Aucun exercice disponible pour le moment.
    </div>

    <div th:each="exercise : ${exercises}" class="card mb-4 shadow-sm" th:id="'exercise-card-' + ${exercise.id}">
        <div class="card-body">
            <h5 class="card-title" th:text="${exercise.question}"></h5>

            <div class="mt-3">
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}" th:id="${'optA' + exercise.id}" value="A">
                    <label class="form-check-label ms-2" th:text="${exercise.optionA}" th:for="${'optA' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}" th:id="${'optB' + exercise.id}" value="B">
                    <label class="form-check-label ms-2" th:text="${exercise.optionB}" th:for="${'optB' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}" th:id="${'optC' + exercise.id}" value="C">
                    <label class="form-check-label ms-2" th:text="${exercise.optionC}" th:for="${'optC' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}" th:id="${'optD' + exercise.id}" value="D">
                    <label class="form-check-label ms-2" th:text="${exercise.optionD}" th:for="${'optD' + exercise.id}"></label>
                </div>
            </div>

            <button class="btn btn-success mt-3"
                    th:onclick="checkAnswer(this, [[${exercise.id}]], [[${exercise.correctAnswer}]])">Vérifier</button>

            <div class="mt-3 alert d-none" th:id="${'result-' + exercise.id}"></div>
        </div>
    </div>

    <a th:href="@{/lesson/{id}(id=${lesson.id})}" class="btn btn-secondary">← Retour à la leçon</a>
</div>

<input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" id="csrfToken" />

<script>
    function checkAnswer(btn, exerciseId, correctAnswer) {
        const card = document.getElementById(`exercise-card-${exerciseId}`);
        const checkedRadio = card.querySelector(`input[name="qcm-${exerciseId}"]:checked`);

        if (!checkedRadio) {
            alert("Veuillez sélectionner une réponse avant de vérifier !");
            return;
        }

        // 1. On récupère le TEXTE de l'option que l'utilisateur a cochée
        const userText = card.querySelector(`label[for="${checkedRadio.id}"]`).textContent.trim();

        // 2. On nettoie proprement la bonne réponse de la BDD (gestion des majuscules/espaces)
        const cleanCorrectAnswer = String(correctAnswer).trim().toUpperCase();
        const cleanUserAnswer = userText.toUpperCase();

        const resultDiv = document.getElementById(`result-${exerciseId}`);

        // Désactiver le bouton et les inputs pour bloquer après validation
        btn.disabled = true;
        card.querySelectorAll(`input[name="qcm-${exerciseId}"]`).forEach(input => input.disabled = true);

        resultDiv.classList.remove('d-none');

        // 3. Comparaison textuelle sécurisée
        if (cleanUserAnswer === cleanCorrectAnswer) {
            checkedRadio.closest('.option-container').classList.add('bg-success', 'text-white');
            resultDiv.classList.add('alert-success');
            resultDiv.innerHTML = "<strong>🎉 Correct !</strong> Excellente réponse.";
        } else {
            checkedRadio.closest('.option-container').classList.add('bg-danger', 'text-white');
            resultDiv.classList.add('alert-danger');
            resultDiv.innerHTML = `<strong>❌ Incorrect.</strong> La bonne réponse était : "${correctAnswer}".`;

            // On cherche quelle option contenait le bon texte pour la mettre en vert
            card.querySelectorAll('.option-container').forEach(container => {
                const labelText = container.querySelector('label').textContent.trim().toUpperCase();
                if (labelText === cleanCorrectAnswer) {
                    container.classList.add('bg-success', 'text-white');
                }
            });
        }

        // 4. ENVOI AU SCORECONTROLLER (JAVA)
        const formData = new FormData();
        formData.append("userAnswer", userText); // Envoie le texte exact (ex: "un livre") à votre Java
// Récupération sécurisée des tokens CSRF depuis les balises meta
    const token = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
    const header = document.querySelector("meta[name='_csrf_header']")?.getAttribute("content");
    const headers={}
    if(token && header){
    headers[header] = token;}//injecte dynamiquement "X-CSRF-TOKEN" : "la valeur"

        fetch(`/exercise/submit/${exerciseId}`, {
            method: 'POST',
            headers: headers,
            body: formData
        })
        .then(response => {
            if (response.ok) {
                console.log(`Exercice ${exerciseId} sauvegardé en BDD !`);
            } else {
                console.error("Erreur ou utilisateur non connecté.");
            }
        })
        .catch(err => console.error("Erreur réseau :", err));
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
