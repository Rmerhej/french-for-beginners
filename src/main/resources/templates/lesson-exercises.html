<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lesson.title} + ' - Exercices'"></title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h2 th:text="${lesson.title}"></h2>
    <h4 class="text-primary">Exercices</h4>

    <div th:if="${exercises.isEmpty()}" class="alert alert-info">
        Aucun exercice disponible pour le moment.
    </div>

    <div th:each="exercise : ${exercises}" class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title" th:text="${exercise.question}"></h5>

            <div class="mt-3">
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="q" th:id="${'optA' + exercise.id}">
                    <label class="form-check-label" th:text="${exercise.optionA}" th:for="${'optA' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="q" th:id="${'optB' + exercise.id}">
                    <label class="form-check-label" th:text="${exercise.optionB}" th:for="${'optB' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="q" th:id="${'optC' + exercise.id}">
                    <label class="form-check-label" th:text="${exercise.optionC}" th:for="${'optC' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="q" th:id="${'optD' + exercise.id}">
                    <label class="form-check-label" th:text="${exercise.optionD}" th:for="${'optD' + exercise.id}"></label>
                </div>
            </div>

            <button class="btn btn-success mt-3" onclick="checkAnswer(this)">Vérifier</button>

            <div class="mt-3 alert" style="display:none" th:id="${'result' + exercise.id}">
                <!-- Résultat JS sera affiché ici -->
            </div>
        </div>
    </div>

    <a th:href="@{/lesson/{id}(id=${lesson.id})}" class="btn btn-secondary">← Retour à la leçon</a>
</div>

<script>
    function checkAnswer(btn) {
        const card = btn.closest('.card');
        const resultDiv = card.querySelector('div[style*="none"]');
        // Pour l'instant simple alerte (on améliorera plus tard avec correction réelle)
        alert("Fonctionnalité de correction en cours de développement !");
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
