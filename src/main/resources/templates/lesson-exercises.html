<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${lesson.title} + ' - Exercices'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link th:href="@{/css/style.css}" type="text/css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<head>
    <meta th:if="${_csrf}" th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf}" th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<button
        type="button"
        class="btn btn-outline-secondary float-end"
        onclick="history.back()">
    <i class="bi bi-arrow-left"></i> Retour
</button>
<div class="container mt-4">
    <h2 th:text="${lesson.title}"></h2>
    <h4 class="text-primary">Exercices</h4>

    <div th:if="${exercises.isEmpty()}" class="alert alert-info">
        Aucun exercice disponible pour le moment.
    </div>

    <div th:each="exercise : ${exercises}" class="card mb-4 shadow-sm" th:id="'exercise-card-' + ${exercise.id}">
        <div class="card-body">
            <h5 class="card-title" th:text="${exercise.question}"></h5>

            <div class="mt-3">
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}" th:id="${'optA' + exercise.id}" value="A">
                    <label class="form-check-label ms-2" th:text="${exercise.optionA}" th:for="${'optA' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}" th:id="${'optB' + exercise.id}" value="B">
                    <label class="form-check-label ms-2" th:text="${exercise.optionB}" th:for="${'optB' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}" th:id="${'optC' + exercise.id}" value="C">
                    <label class="form-check-label ms-2" th:text="${exercise.optionC}" th:for="${'optC' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}" th:id="${'optD' + exercise.id}" value="D">
                    <label class="form-check-label ms-2" th:text="${exercise.optionD}" th:for="${'optD' + exercise.id}"></label>
                </div>
            </div>

            <button class="btn btn-success mt-3"
                    th:onclick="checkAnswer(this, [[${exercise.id}]], [[${exercise.correctAnswer}]])">Vérifier</button>

            <div class="mt-3 alert d-none" th:id="${'result-' + exercise.id}"></div>
        </div>
    </div>

    <a th:href="@{/lesson/{id}(id=${lesson.id})}" class="btn btn-secondary">← Retour à la leçon</a>
</div>

<input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" id="csrfToken" />
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/lesson-exercises.js}"></script>
</body>
</html>
