<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='leçon_exercises')}">
    <meta th:if="${_csrf}" th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf}" th:name="_csrf_header" th:content="${_csrf.headerName}"/>

</head>
<body>
<a href="#main-content" class="visually-hidden-focusable">
    Aller au contenu principal
</a>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<button
        type="button"
        class="btn btn-outline-secondary float-end"
        onclick="history.back()"
        aria-label="Page précédente">
    <i class="bi bi-arrow-left" aria-hidden="true"></i> Retour
</button>
<main id="main-content" class="container mt-4">
    <h1 th:text="${lesson.title}"></h1>
    <h2 class="text-primary">Exercices</h2>

    <div th:if="${exercises.isEmpty()}" class="alert alert-info">
        Aucun exercice disponible pour le moment.
    </div>

    <div th:each="exercise : ${exercises}" class="card mb-4 shadow-sm" th:id="'exercise-card-' + ${exercise.id}">
        <div class="card-body">
            <h3 class="card-title" th:text="${exercise.question}"></h3>

            <fieldset class="mt-3">
                <legend class="visually-hidden">Choisissez une réponse</legend>
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}"
                           th:id="${'optA' + exercise.id}" value="A">
                    <label class="form-check-label ms-2" th:text="${exercise.optionA}"
                           th:for="${'optA' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}"
                           th:id="${'optB' + exercise.id}" value="B">
                    <label class="form-check-label ms-2" th:text="${exercise.optionB}"
                           th:for="${'optB' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}"
                           th:id="${'optC' + exercise.id}" value="C">
                    <label class="form-check-label ms-2" th:text="${exercise.optionC}"
                           th:for="${'optC' + exercise.id}"></label>
                </div>
                <div class="form-check mb-2 p-2 rounded option-container">
                    <input class="form-check-input ms-1" type="radio" th:name="'qcm-' + ${exercise.id}"
                           th:id="${'optD' + exercise.id}" value="D">
                    <label class="form-check-label ms-2" th:text="${exercise.optionD}"
                           th:for="${'optD' + exercise.id}"></label>
                </div>
            </fieldset>

            <button class="btn btn-success mt-3"
                    th:onclick="checkAnswer(this, [[${exercise.id}]], [[${exercise.correctAnswer}]])">Vérifier
            </button>

            <div class="mt-3 alert d-none" role="status" aria-live="polite" th:id="${'result-' + exercise.id}"></div>
        </div>
    </div>

    <a th:href="@{/lesson/{id}(id=${lesson.id})}" class="btn btn-secondary">← Retour à la leçon</a>
</main>

<input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" id="csrfToken"/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/lesson-exercises.js}"></script>
</body>
</html>
