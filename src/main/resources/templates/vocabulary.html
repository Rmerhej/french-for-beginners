<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulaire - Français Débutant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">🇫🇷 Français Débutant</a>
        <a class="btn btn-outline-light" href="/lessons">Leçons</a>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">📖 Vocabulaire de base</h1>
    <button
            type="button"
            class="btn btn-outline-secondary float-end"
            onclick="history.back()">
        <i class="bi bi-arrow-left"></i> Retour
    </button>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="word : ${vocabularies}">
            <div class="card h-100">
                <div class="card-body text-center">
                    <h4 class="card-title text-primary" th:text="${word.frenchWord}"></h4>
                    <p class="text-muted" th:text="${word.pronunciation}"></p>
                    <h5 th:text="${word.englishTranslation}"></h5>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
