<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Verbes réguliers')}"></head>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="text-primary">Les verbes réguliers</h1>
            <button
                    type="button"
                    class="btn btn-outline-secondary float-end"
                    onclick="history.back()">
                <i class="bi bi-arrow-left"></i> Retour
            </button>
            <p class="lead">Ils suivent des règles fixes de conjugaison.</p>

            <h3>Exemple : verbe en -ER</h3>

            <div class="card bg-light p-3 mb-3">
                <ul class="mb-0">
                    <li>je parle</li>
                    <li>tu parles</li>
                    <li>il/elle parle</li>
                    <li>nous parlons</li>
                    <li>vous parlez</li>
                    <li>ils/elles parlent</li>
                </ul>
            </div>

            <h3>Autres verbes</h3>
            <span class="badge bg-primary">manger</span>
            <span class="badge bg-secondary">travailler</span>
            <span class="badge bg-success">écouter</span>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
</body>
</html>
