<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title> Quizzes-student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .quiz-item { transition: transform 0.2s; }
        .quiz-item:hover { transform: scale(1.01); }
    </style>
</head>
<body class="bg-light">


<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container py-5">
    <h2 class="mb-4">Quiz disponibles</h2>
    <button
            type="button"
            class="btn btn-outline-secondary float-end"
            onclick="history.back()">
        <i class="bi bi-arrow-left"></i> Retour
    </button>
    <div th:if="${quizzes.isEmpty()}" class="alert alert-info">
        Aucun quiz n'est disponible pour le moment.
    </div>

    <div class="d-grid gap-3 col-md-8 mx-auto">

        <div th:each="quiz : ${quizzes}"  th:if="${#strings.contains(quiz.title, 'Grammaire')}"  class="card p-3 shadow-sm quiz-item">
            <div class="d-flex justify-content-between align-items-center">

                <h5 class="mb-0" th:text="${quiz.title}" th:if="${#strings.contains(quiz.title, 'préposition,conjonction de coordination')}" >Titre du Quiz</h5>

               <a th:href="@{/quiz/{id}(id=${quiz.id})}"
                   class="btn btn-primary">
                    Commencer le quiz
                </a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
