<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <th:block th:replace="~{fragments/assets :: bootstrap}"></th:block>
    <title>Test d'evaluation</title>
    <link rel="stylesheet" th:href="@{/css/qcm.css}">
</head>
<body>
<a href="#main-content" class="visually-hidden-focusable">Aller au contenu principal</a>
<div th:replace="~{fragments/navbar :: navbar}"></div>


<div class="container my-3">
    <div class="alert alert-success">
        Score : <span id="score">0</span> / <span id="total">0</span>
    </div>
</div>

<h1 class="text-center mt-5 mb-3 text-primary">TEST D'ÉVALUATION DE FRANÇAIS (A1 - B2)</h1>
<h3 class="text-center">Grammaire ,Vocabulaire ,Compréhension ,Communication. </h3>
<h4  class="text-center text-primary">N.B : Veuillez vérifier chaque réponse au fur et à mesure. </h4>
<main class="container mb-5" id="main-content">

    <!-- Boucle Thymeleaf sur les exercices -->
    <div class="card shadow-sm mb-4 exercise-card"
         th:each="ex : ${exercises}"
         th:if="${ex != null and #strings.containsIgnoreCase(ex.lessonTitle, 'test')}"
         th:id="'exercise-container-' + ${ex.id}"
         th:data-level="${ex.lessonLevel}">

        <div class="card-header">
            <strong th:text="${ex.lessonTitle}" class="text-secondary"></strong>
        </div>

        <div class="card-body">
            <h2 class="card-title fs-5 mb-4" th:text="${ex.question}"></h2>

            <fieldset class="options mb-3">
                <legend class="visually-hidden">Choisissez une réponse</legend>
                <div class="form-check border rounded p-3 mb-2 d-flex align-items-center option-wrapper">
                    <input class="form-check-input" type="radio" th:name="'answer-' + ${ex.id}"
                           th:id="'optA-' + ${ex.id}" value="A">
                    <label class="form-check-label w-100 ms-2" th:for="'optA-' + ${ex.id}"
                           th:text="${ex.optionA}"></label>
                </div>
                <div class="form-check border rounded p-3 mb-2 d-flex align-items-center option-wrapper">
                    <input class="form-check-input" type="radio" th:name="'answer-' + ${ex.id}"
                           th:id="'optB-' + ${ex.id}" value="B">
                    <label class="form-check-label w-100 ms-2" th:for="'optB-' + ${ex.id}"
                           th:text="${ex.optionB}"></label>
                </div>
                <div class="form-check border rounded p-3 mb-2 d-flex align-items-center option-wrapper">
                    <input class="form-check-input" type="radio" th:name="'answer-' + ${ex.id}"
                           th:id="'optC-' + ${ex.id}" value="C">
                    <label class="form-check-label w-100 ms-2" th:for="'optC-' + ${ex.id}"
                           th:text="${ex.optionC}"></label>
                </div>
                <div class="form-check border rounded p-3 mb-2 d-flex align-items-center option-wrapper">
                    <input class="form-check-input" type="radio" th:name="'answer-' + ${ex.id}"
                           th:id="'optD-' + ${ex.id}" value="D">
                    <label class="form-check-label w-100 ms-2" th:for="'optD-' + ${ex.id}"
                           th:text="${ex.optionD}"></label>
                </div>
            </fieldset>

            <button type="button" class="btn btn-primary verify-btn"
                    data-click="submitAndCheck" th:data-arg0="${ex.id}" th:data-arg1="${ex.correctAnswer}">
                Vérifier
            </button>
        </div>

        <div class="card-footer d-none explanation text-muted" th:id="'explanation-' + ${ex.id}">
            <strong>Explication : </strong> <span th:text="${ex.explanation}"></span>
        </div>
    </div>

    <!-- Bouton et conteneur de résultat -->
    <div class="text-center my-5">
        <button type="button" class="btn btn-success btn-lg shadow" data-click="showEvaluationResult">
            <i class="bi bi-award" aria-hidden="true"></i> Voir votre niveau
        </button>
    </div>

    <div id="evaluation-result-container" class="alert alert-info d-none text-center shadow-sm mx-auto"
         style="max-width: 600px;">
        <h4 class="alert-heading font-weight-bold">Votre niveau estimé : <span id="cecr-level"
                                                                               class="badge bg-primary fs-4">-</span>
        </h4>
        <p id="cecr-description" class="mb-0 mt-2"></p>
        <p id="cecr-details" class="small mb-0 mt-2 text-start" style="white-space: pre-line;"></p>
    </div>

</main>

<input type="hidden" id="csrfToken" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/assets :: bootstrap-js}"></th:block>

<script th:src="@{/js/placement-level.js}"></script>
<script th:src="@{/js/evaluation.js}"></script>

</body>
</html>
