<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Cours de français sur Le futur simple pour adultes débutants">
    <title>Le futur simple</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<button
        type="button"
        class="btn btn-outline-secondary float-end"
        onclick="history.back()">
    <i class="bi bi-arrow-left"></i> Retour
</button>
<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="text-primary">Le futur simple</h1>
            <p class="lead">Le futur simple sert à parler d’actions qui vont se passer plus tard.</p>

            <h3>Formation</h3>
            <ul class="list-group mb-3">
                <li class="list-group-item">je -ai</li>
                <li class="list-group-item">tu -as</li>
                <li class="list-group-item">il/elle -a</li>
                <li class="list-group-item">nous -ons</li>
                <li class="list-group-item">vous -ez</li>
                <li class="list-group-item">ils/elles -ont</li>
            </ul>

            <h3>Exemples</h3>
            <div class="alert alert-info">
                Je <b>parlerai</b> français.<br>
                Nous <b>irons</b> à Paris.
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/back-to-top :: backToTop}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
